<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Typrr — Master Touch Typing</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #282a36;
  --bg-card: #44475a;
  --bg-card-hover: #4d5070;
  --bg-input: #21222c;
  --border: #3a3d50;
  --text: #f8f8f2;
  --text-dim: #8494cc;
  --text-muted: #7c88ad;
  --accent: #d4b8fd;
  --accent-glow: rgba(212, 184, 253, 0.15);
  --accent-light: #e8daff;
  --green: #50fa7b;
  --green-dim: rgba(80, 250, 123, 0.12);
  --red: #ff5555;
  --red-dim: rgba(255, 85, 85, 0.12);
  --orange: #ffb86c;
  --orange-dim: rgba(255, 184, 108, 0.12);
  --blue: #8be9fd;
  --blue-dim: rgba(139, 233, 253, 0.12);
  --gold: #f1fa8c;
  --pink: #ff79c6;
  --radius: 14px;
  --radius-sm: 10px;
  --shadow: 0 2px 8px rgba(0,0,0,0.25);
  --shadow-lg: 0 8px 24px rgba(0,0,0,0.3);
  --font: 'Georgia', 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif;
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --mono: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
}

html { font-size: 16px; }
body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #cdc4b7; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #b5aa9a; }

/* Layout */
.app { display: flex; min-height: 100vh; }

/* Sidebar */
.sidebar {
  width: 280px;
  background: var(--bg-card);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0; left: 0; bottom: 0;
  z-index: 100;
  transition: transform 0.3s;
}
.sidebar-header {
  padding: 24px 20px 16px;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(135deg, #343746, var(--bg-card));
}
.logo {
  font-size: 1.4rem;
  font-weight: 800;
  font-family: var(--font-sans);
  letter-spacing: -0.5px;
  color: var(--accent);
}
.logo-sub { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }

/* User Stats in Sidebar */
.user-stats {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.stat-mini {
  background: var(--bg);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  text-align: center;
  border: 1px solid var(--border);
}
.stat-mini-value { font-size: 1.1rem; font-weight: 700; color: var(--accent); }
.stat-mini-label { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }

/* XP Bar */
.xp-bar-wrap {
  padding: 12px 20px;
  border-bottom: 1px solid var(--border);
}
.xp-bar-header { display: flex; justify-content: space-between; margin-bottom: 6px; }
.xp-level { font-size: 0.8rem; font-weight: 600; color: var(--gold); font-family: var(--font-sans); }
.xp-count { font-size: 0.75rem; color: var(--text-dim); font-family: var(--font-sans); }
.xp-bar-track {
  height: 6px;
  background: var(--bg);
  border-radius: 3px;
  overflow: hidden;
}
.xp-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--gold));
  border-radius: 3px;
  transition: width 0.5s ease;
  width: 0%;
}

/* Nav */
.nav { flex: 1; overflow-y: auto; padding: 12px 0; }
.nav-section-title {
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-muted);
  padding: 12px 20px 6px;
  font-weight: 600;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 20px;
  cursor: pointer;
  transition: all 0.15s;
  border-left: 3px solid transparent;
  font-size: 0.85rem;
  color: var(--text-dim);
  font-family: var(--font-sans);
}
.nav-item:hover { background: var(--bg-card-hover); color: var(--text); }
.nav-item.active {
  background: var(--bg-card-hover);
  color: var(--text);
  border-left-color: var(--accent);
  font-weight: 500;
}
.nav-item.locked { opacity: 0.35; cursor: not-allowed; pointer-events: none; }
.nav-item-icon {
  width: 30px; height: 30px;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.9rem;
  flex-shrink: 0;
}
.nav-item.completed .nav-item-icon { background: var(--green-dim); color: var(--green); }
.nav-item.current .nav-item-icon { background: var(--accent-glow); color: var(--accent-light); }
.nav-item.locked .nav-item-icon { background: var(--bg); color: var(--text-muted); }
.nav-item-text { flex: 1; line-height: 1.3; }
.nav-item-badge {
  font-size: 0.65rem;
  padding: 2px 8px;
  border-radius: 6px;
  font-weight: 600;
  font-family: var(--font-sans);
}
.badge-test { background: var(--orange-dim); color: var(--orange); }
.badge-new { background: var(--blue-dim); color: var(--blue); }
.nav-stars { font-size: 0.65rem; color: var(--gold); letter-spacing: 1px; }

/* Sidebar Footer */
.sidebar-footer {
  padding: 16px 20px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 8px;
}
.btn-sidebar {
  flex: 1;
  padding: 8px;
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text-dim);
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 0.75rem;
  text-align: center;
  transition: all 0.15s;
  font-family: var(--font-sans);
}
.btn-sidebar:hover { border-color: var(--accent); color: var(--accent); }

/* Main Content */
.main {
  flex: 1;
  margin-left: 280px;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* Header */
.main-header {
  padding: 18px 32px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--bg-card);
  position: sticky;
  top: 0;
  z-index: 50;
}
.breadcrumb { font-size: 0.8rem; color: var(--text-dim); font-family: var(--font-sans); }
.breadcrumb span { color: var(--text); font-weight: 600; }
.streak-badge {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--orange-dim);
  color: var(--orange);
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 0.8rem;
  font-weight: 600;
  border: 1px solid #f0dcc8;
  font-family: var(--font-sans);
}
.hamburger {
  display: none;
  background: none;
  border: none;
  color: var(--text);
  font-size: 1.4rem;
  cursor: pointer;
  padding: 4px 8px;
  font-family: var(--font-sans);
}

/* Content Area */
.content { flex: 1; padding: 32px; max-width: 960px; margin: 0 auto; width: 100%; }

/* Dashboard */
.dashboard-title {
  font-size: 1.8rem;
  font-weight: 800;
  margin-bottom: 4px;
  font-family: var(--font-sans);
  color: var(--text);
}
.dashboard-subtitle { color: var(--text-dim); margin-bottom: 28px; font-size: 0.9rem; font-family: var(--font-sans); }

.stats-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 32px;
}
.stat-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  text-align: center;
  box-shadow: var(--shadow);
}
.stat-card-icon { font-size: 1.5rem; margin-bottom: 8px; }
.stat-card-value { font-size: 1.6rem; font-weight: 700; color: var(--text); font-family: var(--font-sans); }
.stat-card-label { font-size: 0.75rem; color: var(--text-dim); margin-top: 4px; }

/* Stage Cards */
.stages-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
  margin-bottom: 32px;
}
.stage-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
  overflow: hidden;
  box-shadow: var(--shadow);
}
.stage-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.stage-card.locked { opacity: 0.5; cursor: not-allowed; }
.stage-card.locked:hover { transform: none; border-color: var(--border); box-shadow: none; }
.stage-card-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.stage-card-number {
  width: 40px; height: 40px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700;
  font-size: 1rem;
  background: var(--accent-glow);
  color: var(--accent-light);
}
.stage-card.completed .stage-card-number { background: var(--green-dim); color: var(--green); }
.stage-card-title { font-weight: 600; font-size: 1rem; font-family: var(--font-sans); }
.stage-card-desc { font-size: 0.8rem; color: var(--text-dim); line-height: 1.5; margin-bottom: 16px; font-family: var(--font-sans); }
.stage-progress-bar {
  height: 4px;
  background: var(--bg);
  border-radius: 2px;
  overflow: hidden;
  margin-bottom: 8px;
}
.stage-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--green));
  border-radius: 2px;
  transition: width 0.5s;
}
.stage-meta { display: flex; justify-content: space-between; font-size: 0.7rem; color: var(--text-muted); }
.stage-card .lock-icon {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 2rem;
  color: var(--text-muted);
  display: none;
}
.stage-card.locked .lock-icon { display: block; }
.stage-card.locked .stage-card-header,
.stage-card.locked .stage-card-desc,
.stage-card.locked .stage-progress-bar,
.stage-card.locked .stage-meta { visibility: hidden; }

/* Lesson View */
.lesson-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
}
.lesson-title { font-size: 1.3rem; font-weight: 700; font-family: var(--font-sans); }
.lesson-timer {
  font-family: var(--mono);
  font-size: 1.1rem;
  color: var(--accent);
  background: var(--bg-card);
  padding: 8px 16px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
}

/* Live Stats */
.live-stats {
  display: flex;
  gap: 16px;
  margin-bottom: 24px;
}
.live-stat {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 20px;
  flex: 1;
  text-align: center;
  box-shadow: var(--shadow);
}
.live-stat-value { font-size: 1.3rem; font-weight: 700; font-family: var(--mono); }
.live-stat-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; margin-top: 2px; font-family: var(--font-sans); }
.live-stat.wpm .live-stat-value { color: var(--accent); }
.live-stat.accuracy .live-stat-value { color: var(--green); }
.live-stat.errors .live-stat-value { color: var(--red); }

/* Typing Area */
.typing-area {
  background: var(--bg-card);
  border: 2px solid var(--border);
  border-radius: var(--radius);
  padding: 32px;
  margin-bottom: 24px;
  min-height: 200px;
  position: relative;
  box-shadow: inset 0 1px 3px rgba(44,36,24,0.03);
}
.typing-text {
  font-family: var(--mono);
  font-size: 1.3rem;
  line-height: 2;
  letter-spacing: 0.3px;
  user-select: none;
  word-break: break-word;
  color: var(--text);
}
.typing-text .char { position: relative; transition: color 0.05s; }
.typing-text .char.correct { color: var(--green); }
.typing-text .char.incorrect { color: var(--red); background: var(--red-dim); border-radius: 2px; }
.typing-text .char.current {
  color: var(--text);
  border-bottom: 2px solid var(--accent);
  animation: blink 1s ease-in-out infinite;
}
.typing-text .char.pending { color: var(--text-muted); }
@keyframes blink { 0%, 100% { border-bottom-color: var(--accent); } 50% { border-bottom-color: transparent; } }
.typing-area.active .typing-text .char.current { animation: none; border-bottom-color: var(--accent); }

/* Focus prompt */
.focus-prompt {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(30,26,21,0.92);
  border-radius: var(--radius);
  z-index: 10;
  cursor: pointer;
  backdrop-filter: blur(4px);
}
.focus-prompt-text {
  font-size: 1.05rem;
  color: var(--text-dim);
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-sans);
}
.focus-prompt-text kbd {
  background: var(--bg-card);
  border: 1px solid var(--border);
  padding: 4px 10px;
  border-radius: 6px;
  font-family: var(--mono);
  font-size: 0.85rem;
  box-shadow: 0 1px 2px rgba(44,36,24,0.06);
}

/* Virtual Keyboard */
.keyboard {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 20px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  align-items: center;
  margin-bottom: 24px;
  box-shadow: var(--shadow);
}
.kb-row { display: flex; gap: 4px; }
.kb-key {
  min-width: 44px;
  height: 40px;
  border: 1px solid var(--border);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--mono);
  font-size: 0.8rem;
  color: var(--text-dim);
  background: var(--bg);
  transition: all 0.1s;
  text-transform: uppercase;
}
.kb-key.active {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
  box-shadow: 0 2px 8px var(--accent-glow);
}
.kb-key.correct {
  background: var(--green-dim);
  border-color: var(--green);
  color: var(--green);
}
.kb-key.wrong {
  background: var(--red-dim);
  border-color: var(--red);
  color: var(--red);
}
.kb-key.space { min-width: 280px; }
.kb-key.wide { min-width: 70px; font-size: 0.7rem; }
.kb-key.wider { min-width: 90px; font-size: 0.7rem; }

/* Finger color coding */
.kb-key[data-finger="l5"] { border-left: 3px solid #ff6e6e; }
.kb-key[data-finger="l4"] { border-left: 3px solid #ffb86c; }
.kb-key[data-finger="l3"] { border-left: 3px solid #50fa7b; }
.kb-key[data-finger="l2"] { border-left: 3px solid #8be9fd; }
.kb-key[data-finger="r2"] { border-left: 3px solid #d4b8fd; }
.kb-key[data-finger="r3"] { border-left: 3px solid #ff79c6; }
.kb-key[data-finger="r4"] { border-left: 3px solid #f1fa8c; }
.kb-key[data-finger="r5"] { border-left: 3px solid #ff5555; }
.kb-key[data-finger="thumb"] { border-left: 3px solid var(--text-muted); }

.kb-key.finger-highlight {
  background: var(--accent-glow);
  border-color: var(--accent);
  color: var(--accent-light);
  transform: scale(1.05);
  box-shadow: 0 0 10px var(--accent-glow);
}

/* Finger guide */
.finger-guide {
  display: flex;
  justify-content: center;
  gap: 24px;
  padding: 16px 20px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.finger-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.72rem;
  color: var(--text-dim);
  font-family: var(--font-sans);
}
.finger-dot {
  width: 14px; height: 14px;
  border-radius: 4px;
  border: 2px solid;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.55rem;
  font-weight: 700;
  font-family: var(--font-sans);
}

/* Hand diagram */
.hand-diagram {
  display: flex;
  justify-content: center;
  gap: 48px;
  padding: 12px 20px 8px;
  margin-bottom: 8px;
}
.hand {
  display: flex;
  gap: 3px;
  align-items: flex-end;
}
.finger {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}
.finger-bar {
  width: 18px;
  border-radius: 6px 6px 3px 3px;
  transition: all 0.15s;
  opacity: 0.5;
}
.finger-bar.active {
  opacity: 1;
  transform: scaleY(1.15);
  box-shadow: 0 0 8px currentColor;
}
.finger-label {
  font-size: 0.55rem;
  color: var(--text-muted);
  font-family: var(--font-sans);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

/* Combo counter */
.combo-counter {
  position: absolute;
  top: -32px;
  right: 12px;
  font-family: var(--mono);
  font-size: 1.4rem;
  font-weight: 800;
  transition: all 0.2s ease;
  pointer-events: none;
}
.combo-1-text { color: var(--text-dim); font-size: 1rem; }
.combo-5-text { color: var(--accent); font-size: 1.2rem; }
.combo-10-text { color: var(--green); font-size: 1.4rem; text-shadow: 0 0 10px var(--green-dim); }
.combo-20-text { color: var(--gold); font-size: 1.6rem; text-shadow: 0 0 16px rgba(241,250,140,0.3); }
.combo-50-text { color: var(--pink); font-size: 1.8rem; text-shadow: 0 0 20px rgba(255,121,198,0.4); animation: comboPulse 0.4s ease infinite alternate; }

@keyframes comboPulse {
  from { transform: scale(1); }
  to { transform: scale(1.12); }
}

/* Keyboard combo glow levels */
.keyboard {
  position: relative;
  transition: box-shadow 0.3s ease, border-color 0.3s ease;
}
.keyboard.combo-1 {
  box-shadow: 0 0 8px rgba(212,184,253,0.08);
}
.keyboard.combo-5 {
  border-color: var(--accent);
  box-shadow: 0 0 20px rgba(212,184,253,0.15), inset 0 0 30px rgba(212,184,253,0.04);
}
.keyboard.combo-10 {
  border-color: var(--green);
  box-shadow: 0 0 30px rgba(80,250,123,0.18), inset 0 0 40px rgba(80,250,123,0.05);
}
.keyboard.combo-20 {
  border-color: var(--gold);
  box-shadow: 0 0 40px rgba(241,250,140,0.15), inset 0 0 50px rgba(241,250,140,0.04);
  animation: keyboardGlow 1.5s ease-in-out infinite alternate;
}
.keyboard.combo-50 {
  border-color: var(--pink);
  box-shadow: 0 0 60px rgba(255,121,198,0.2), inset 0 0 60px rgba(255,121,198,0.05);
  animation: keyboardGlowIntense 0.8s ease-in-out infinite alternate;
}

@keyframes keyboardGlow {
  from { box-shadow: 0 0 30px rgba(241,250,140,0.1), inset 0 0 40px rgba(241,250,140,0.03); }
  to { box-shadow: 0 0 50px rgba(241,250,140,0.2), inset 0 0 60px rgba(241,250,140,0.06); }
}
@keyframes keyboardGlowIntense {
  from { box-shadow: 0 0 50px rgba(255,121,198,0.15), inset 0 0 50px rgba(255,121,198,0.04); }
  to { box-shadow: 0 0 80px rgba(255,121,198,0.3), inset 0 0 70px rgba(255,121,198,0.08); }
}

/* Results Modal */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(44,36,24,0.3);
  backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}
.modal-overlay.show { opacity: 1; pointer-events: all; }
.modal {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 40px;
  max-width: 500px;
  width: 90%;
  text-align: center;
  transform: scale(0.9);
  transition: transform 0.3s;
  box-shadow: var(--shadow-lg);
}
.modal-overlay.show .modal { transform: scale(1); }
.modal-icon { font-size: 3rem; margin-bottom: 16px; }
.modal-title { font-size: 1.5rem; font-weight: 800; margin-bottom: 8px; font-family: var(--font-sans); }
.modal-subtitle { color: var(--text-dim); margin-bottom: 24px; font-size: 0.9rem; font-family: var(--font-sans); }
.modal-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 24px;
}
.modal-stat {
  background: var(--bg);
  border-radius: var(--radius-sm);
  padding: 16px 12px;
  border: 1px solid var(--border);
}
.modal-stat-value { font-size: 1.3rem; font-weight: 700; font-family: var(--mono); }

  font-weight: 700;
  margin-right: 4px;

.btn {
  padding: 12px 24px;
  border-radius: var(--radius-sm);
  border: none;
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  font-family: var(--font-sans);
}
.btn-primary { background: var(--accent); color: #282a36; font-weight: 700; }

.btn-secondary { background: var(--bg-card); color: var(--text-dim); border: 1px solid var(--border); }
.btn-secondary:hover { border-color: var(--accent); color: var(--text); }

.badges-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 12px;

.badge-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  text-align: center;
  transition: all 0.2s;
  box-shadow: var(--shadow);
}
.badge-card.earned { border-color: var(--gold); background: var(--orange-dim); }
.badge-card.locked { opacity: 0.4; }
.badge-card-icon { font-size: 2rem; margin-bottom: 8px; }
.badge-card-name { font-size: 0.8rem; font-weight: 600; }
.badge-card-desc { font-size: 0.65rem; color: var(--text-muted); margin-top: 4px; }

/* History */
.history-list { display: flex; flex-direction: column; gap: 8px; }
.history-item {
  display: flex;
  align-items: center;
  gap: 16px;

  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 14px 18px;
  box-shadow: var(--shadow);
}
.history-date { font-size: 0.75rem; color: var(--text-muted); min-width: 80px; }
.history-lesson { flex: 1; font-size: 0.85rem; }
.history-wpm { font-family: var(--mono); font-weight: 600; color: var(--accent-light); min-width: 60px; }
.history-accuracy { font-family: var(--mono); font-weight: 600; color: var(--green); min-width: 60px; }
.history-stars { color: var(--gold); min-width: 50px; }

/* Chart */
.chart-container {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  margin-bottom: 24px;
  box-shadow: var(--shadow);
}
.chart-title { font-size: 0.9rem; font-weight: 600; margin-bottom: 16px; font-family: var(--font-sans); }
.chart-bars { display: flex; align-items: flex-end; gap: 4px; height: 120px; }
.chart-bar {
  flex: 1;
  background: linear-gradient(to top, var(--accent), var(--accent-light));
  border-radius: 3px 3px 0 0;
  min-height: 4px;
  transition: height 0.5s ease;
  position: relative;
}
.chart-bar:hover { opacity: 0.8; }
.chart-bar-label {
  position: absolute;
  bottom: -20px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 0.6rem;
  color: var(--text-muted);
  white-space: nowrap;
}

/* Countdown */
.countdown-overlay {
  position: fixed;
  inset: 0;
  background: rgba(30,26,21,0.95);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2000;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
}
.countdown-overlay.show { opacity: 1; pointer-events: all; }
.countdown-number {
  font-size: 8rem;
  font-weight: 800;
  color: var(--accent);
  font-family: var(--font-sans);
  animation: countPulse 0.5s ease;
}
@keyframes countPulse {
  0% { transform: scale(0.5); opacity: 0; }
  50% { transform: scale(1.2); }
  100% { transform: scale(1); opacity: 1; }
}

/* Section titles */
.section-title {
  font-size: 1.1rem;
  font-weight: 600;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-sans);
}

/* Responsive */
@media (max-width: 768px) {

  .main { margin-left: 0; }
  .hamburger { display: block; }
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  .live-stats { flex-wrap: wrap; }
  .live-stat { min-width: calc(50% - 8px); }
  .content { padding: 20px 16px; }
  .typing-text { font-size: 1.1rem; }
  .kb-key { min-width: 32px; height: 34px; font-size: 0.7rem; }

}

/* Hidden input for capturing */
#hiddenInput {
  position: absolute;
  opacity: 0;
  width: 0;
  height: 0;
}

  gap: 4px;

}
.tab-btn {

  border: none;
  color: var(--text-dim);
  font-size: 0.85rem;
  font-weight: 500;

  border-radius: 6px;

.tab-btn.active { background: var(--accent); color: #282a36; font-weight: 700; }
.tab-btn:hover:not(.active) { color: var(--text); }

.achievement-popup {

  top: 20px;
  right: 20px;

  border: 1px solid var(--gold);
  border-radius: var(--radius);
  padding: 16px 20px;

  align-items: center;
  gap: 12px;

.achievement-popup-icon { font-size: 2rem; }
.achievement-popup-text { font-size: 0.85rem; font-family: var(--font-sans); }
.achievement-popup-name { font-weight: 700; color: var(--gold); }
.achievement-popup-desc { color: var(--text-dim); font-size: 0.75rem; margin-top: 2px; }

  padding: 8px 12px 0;
  background: var(--bg);

.theme-tab {

      totalLessons: 0,
      bestWpm: 0,
      bestAccuracy: 0,
      errorKeys: {},    // key -> error count
      practicedLate: false,
      practicedEarly: false,
    };
  },

  load() {
    try {
      const raw = localStorage.getItem(this.KEY);
      this.data = raw ? { ...this.defaults(), ...JSON.parse(raw) } : this.defaults();
    } catch { this.data = this.defaults(); }
    return this.data;
  },

  save() {
    localStorage.setItem(this.KEY, JSON.stringify(this.data));
  },

  get() { if (!this.data) this.load(); return this.data; },
};

  typingActive: false,

  errors: 0,

  combo: 0,
  maxCombo: 0,

  timerInterval: null,
  lessonDuration: 300, // 5 min max
  elapsed: 0,
  wpm: 0,
  accuracy: 100,

  init() {
    Store.load();
    this.updateStreak();
    this.renderSidebar();
    this.showDashboard();
    this.setupInput();
  },

  // ── Streak ──
  updateStreak() {
    const d = Store.get();
    const today = new Date().toDateString();
    if (d.lastPractice === today) return;
    const yesterday = new Date(Date.now() - 86400000).toDateString();
    if (d.lastPractice !== yesterday && d.lastPractice !== today) {
      d.streak = 0;
    }
    Store.save();
  },

  recordPractice() {
    const d = Store.get();
    const today = new Date().toDateString();
    if (d.lastPractice !== today) {
      const yesterday = new Date(Date.now() - 86400000).toDateString();
      d.streak = d.lastPractice === yesterday ? d.streak + 1 : 1;
      d.lastPractice = today;
    }
    const h = new Date().getHours();
    if (h >= 22) d.practicedLate = true;
    if (h < 7) d.practicedEarly = true;
    Store.save();
    this.updateStreakUI();
  },

  // ── XP System ──
  xpForLevel(lvl) { return 100 + (lvl - 1) * 50; },

  addXp(amount) {
    const d = Store.get();
    d.xp += amount;
    while (d.xp >= this.xpForLevel(d.level)) {
      d.xp -= this.xpForLevel(d.level);
      d.level++;
    }
    Store.save();
    this.updateXpUI();
  },

  calcXp(wpm, accuracy, stars) {
    let base = Math.round(wpm * 2 + accuracy);
    if (stars >= 3) base = Math.round(base * 1.5);
    if (stars >= 5) base = Math.round(base * 2);
    return Math.max(10, base);
  },

  // ── Stars ──
  calcStars(wpm, accuracy, minWpm, minAccuracy) {
    let stars = 1;
    if (accuracy >= minAccuracy) stars = 2;
    if (accuracy >= minAccuracy + 2 && wpm >= minWpm) stars = 3;
    if (accuracy >= minAccuracy + 5 && wpm >= minWpm + 10) stars = 4;
    if (accuracy >= 98 && wpm >= minWpm + 20) stars = 5;
    return stars;
  },

  // ── Badges ──
  checkBadges() {
    const d = Store.get();
    const stats = {
      totalLessons: d.totalLessons,
      stagesCleared: d.clearedStages.length,
      bestWpm: d.bestWpm,
      bestAccuracy: d.bestAccuracy,
      streak: d.streak,
      practicedLate: d.practicedLate,
      practicedEarly: d.practicedEarly,
    };
    const newBadges = [];
    for (const b of BADGES) {
      if (!d.badges.includes(b.id) && b.check(stats)) {
        d.badges.push(b.id);
        newBadges.push(b);
      }
    }
    Store.save();
    if (newBadges.length) this.showAchievement(newBadges[0]);
  },

  showAchievement(badge) {
    const el = document.getElementById("achievementPopup");
    document.getElementById("achievementIcon").textContent = badge.icon;
    document.getElementById("achievementName").textContent = badge.name;
    document.getElementById("achievementDesc").textContent = badge.desc;
    el.classList.add("show");
    setTimeout(() => el.classList.remove("show"), 3500);
  },

  // ── Sidebar ──
  renderSidebar() {
    const d = Store.get();
    const nav = document.getElementById("nav");

    // Theme selector
    let html = `<div class="nav-section-title">Themes</div>`;
    for (const tid of THEME_ORDER) {

      const stages = t.stages;
      const clearedCount = stages.filter(s => d.clearedStages.includes(s.id)).length;
      const totalLessons = stages.reduce((sum, s) => sum + s.lessons.length, 0);
      const doneLessons = stages.reduce((sum, s) => sum + s.lessons.filter(l => d.completedLessons[l.id]).length, 0);
      html += `<div class="nav-item ${active ? 'active' : ''}" onclick="App.switchTheme('${tid}')">

          <div>${t.name}</div>

        </div>
      </div>`;

    // Stages for current theme
    const stages = getStages(this.currentTheme);
    html += `<div class="nav-section-title" style="margin-top:8px">${THEMES[this.currentTheme].name}</div>`;
    for (const stage of stages) {
      const cleared = d.clearedStages.includes(stage.id);
      const prevCleared = stage.id === 1 || d.clearedStages.includes(stage.id - 1);
      const locked = !prevCleared && !cleared;
      const lessonCount = stage.lessons.length;
      const completedInStage = stage.lessons.filter(l => d.completedLessons[l.id]).length;
      const progress = cleared ? lessonCount : completedInStage;

      let cls = locked ? "locked" : (cleared ? "completed" : "current");
      let badge = "";
      if (stage.test && !cleared && prevCleared && completedInStage >= lessonCount) {
        badge = `<span class="nav-item-badge badge-test">TEST</span>`;
      } else if (!locked && !cleared && completedInStage === 0) {
        badge = `<span class="nav-item-badge badge-new">NEW</span>`;

      html += `<div class="nav-item ${cls}" onclick="App.openStage(${stage.id})" data-stage="${stage.id}">

        <div class="nav-item-text">
          <div>${stage.title}</div>
          <div style="font-size:0.65rem;color:var(--text-muted)">${progress}/${lessonCount} lessons</div>

            </div>
            <div style="color:var(--text-muted);font-size:0.75rem;line-height:1.4;margin-bottom:8px">${lesson.text.substring(0, 80)}...</div>
            <div style="color:var(--gold);font-size:0.9rem;letter-spacing:2px">${starStr}</div>
          </div>`;
        }).join("")}
      </div>

      ${stage.test ? `
        <div class="section-title">🧪 Stage Test</div>
        <div class="stage-card ${!allDone ? 'locked' : ''}" onclick="${allDone ? `App.startTest(${stageId})` : ''}" style="${allDone ? 'border-color:var(--orange);cursor:pointer' : ''}">
          <div class="lock-icon">🔒</div>
          <div class="stage-card-header">
            <div class="stage-card-number" style="background:var(--orange-dim);color:var(--orange)">🧪</div>
            <div>
              <div class="stage-card-title">${stage.test.title}</div>
              <div style="font-size:0.7rem;color:var(--text-dim)">Requires: ${stage.test.minWpm}+ WPM · ${stage.test.minAccuracy}%+ accuracy</div>
            </div>
          </div>
          ${!allDone ? '<div style="color:var(--text-muted);font-size:0.8rem">Complete all lessons first to unlock the test.</div>' : ''}
          ${cleared ? '<div style="color:var(--green);font-size:0.85rem;font-weight:600;margin-top:8px">✅ Test Passed!</div>' : ''}
        </div>
      ` : ''}
    `;
  },

  // ── Lesson / Test Start ──
  startLesson(stageId, lessonId) {
    const stages = getStages(this.currentTheme);
    const stage = stages.find(s => s.id === stageId);
    const lesson = stage.lessons.find(l => l.id === lessonId);
    this.currentStage = stage;
    this.currentLesson = lesson;
    this.isTest = false;
    this.beginTyping(lesson.text, stageId, lessonId);
  },

  startTest(stageId) {
    const stages = getStages(this.currentTheme);
    const stage = stages.find(s => s.id === stageId);
    this.currentStage = stage;
    this.currentLesson = null;
    this.isTest = true;
    this.beginTyping(stage.test.text, stageId, "test");
  },

  beginTyping(text, stageId, lessonId) {
    this.text = text;
    this.chars = text.split("");
    this.cursor = 0;
    this.errors = 0;
    this.totalTyped = 0;
    this.combo = 0;
    this.maxCombo = 0;
    this.startTime = null;
    this.elapsed = 0;
    this.wpm = 0;
    this.accuracy = 100;
    this.typingActive = false;

    this.view = "typing";
    const el = document.getElementById("content");
    const typeLabel = this.isTest ? "Stage Test" : (this.currentLesson ? this.currentLesson.title : "");
    document.getElementById("breadcrumb").innerHTML = `${this.currentStage.title} — <span>${typeLabel}</span>`;

    // Build char spans
    const charHtml = this.chars.map((c, i) => {
      const display = c === ' ' ? '&nbsp;' : c.replace(/</g,'&lt;').replace(/>/g,'&gt;');
      return `<span class="char ${i === 0 ? 'current' : 'pending'}" data-i="${i}">${display}</span>`;
    }).join("");

    // Keyboard
    const fingerColors = { l5:'#ff6e6e', l4:'#ffb86c', l3:'#50fa7b', l2:'#8be9fd', r2:'#d4b8fd', r3:'#ff79c6', r4:'#f1fa8c', r5:'#ff5555', thumb:'var(--text-muted)' };
    const fingerNames = { l5:'Pinky', l4:'Ring', l3:'Middle', l2:'Index', r2:'Index', r3:'Middle', r4:'Ring', r5:'Pinky', thumb:'Thumb' };
    const kbHtml = KB_ROWS.map(row => {
      return `<div class="kb-row">${row.map(k => {
        const finger = FINGER_MAP[k] || '';
        const cls = k === 'space' ? 'kb-key space' : (k.length > 1 ? 'kb-key wide' : 'kb-key');
        const label = k === 'space' ? '⎵' : k;
        return `<div class="${cls}" data-key="${k}" data-finger="${finger}">${label}</div>`;
      }).join("")}</div>`;
    }).join("");

    // Finger guide
    const guideFingers = [
      { id:'l5', label:'LP', name:'Left Pinky' },
      { id:'l4', label:'LR', name:'Left Ring' },
      { id:'l3', label:'LM', name:'Left Middle' },
      { id:'l2', label:'LI', name:'Left Index' },
      { id:'r2', label:'RI', name:'Right Index' },
      { id:'r3', label:'RM', name:'Right Middle' },
      { id:'r4', label:'RR', name:'Right Ring' },
      { id:'r5', label:'RP', name:'Right Pinky' },
    ];
    const guideHtml = `<div class="finger-guide">${guideFingers.map(f =>
      `<div class="finger-item">
        <div class="finger-dot" style="border-color:${fingerColors[f.id]};color:${fingerColors[f.id]}">${f.label}</div>
        <span>${f.name}</span>
      </div>`
    ).join("")}</div>`;

    // Hand diagram
    const handDiagramHtml = `<div class="hand-diagram">
      <div class="hand">
        ${['l5','l4','l3','l2'].map(f => `<div class="finger"><div class="finger-bar" id="finger-${f}" style="height:${f==='l2'?40:f==='l3'?48:f==='l4'?42:32}px;background:${fingerColors[f]};color:${fingerColors[f]}"></div><div class="finger-label">${fingerNames[f]}</div></div>`).join('')}
      </div>
      <div class="hand">
        ${['r2','r3','r4','r5'].map(f => `<div class="finger"><div class="finger-bar" id="finger-${f}" style="height:${f==='r2'?40:f==='r3'?48:f==='r4'?42:32}px;background:${fingerColors[f]};color:${fingerColors[f]}"></div><div class="finger-label">${fingerNames[f]}</div></div>`).join('')}
      </div>
    </div>`;

    el.innerHTML = `
      <div class="lesson-header">
        <div class="lesson-title">${this.isTest ? '🧪' : '📖'} ${typeLabel}</div>
        <div class="lesson-timer" id="timer">0:00</div>
      </div>

      <div class="live-stats">
        <div class="live-stat wpm">
          <div class="live-stat-value" id="liveWpm">0</div>
          <div class="live-stat-label">WPM</div>
        </div>
        <div class="live-stat accuracy">
          <div class="live-stat-value" id="liveAccuracy">100%</div>
          <div class="live-stat-label">Accuracy</div>
        </div>
        <div class="live-stat errors">
          <div class="live-stat-value" id="liveErrors">0</div>
          <div class="live-stat-label">Errors</div>
        </div>
      </div>

      <div class="typing-area" id="typingArea" onclick="document.getElementById('hiddenInput').focus()">
        <div class="focus-prompt" id="focusPrompt" onclick="App.startFocus()">
          <div class="focus-prompt-text">Click here or press <kbd>Space</kbd> to start typing</div>
        </div>
        <div class="typing-text" id="typingText">${charHtml}</div>
      </div>

      <div class="keyboard" id="keyboard"><div class="combo-counter" id="comboCounter"></div>${handDiagramHtml}${guideHtml}${kbHtml}</div>

      <div style="text-align:center;margin-top:8px">
        <button class="btn btn-secondary" onclick="App.openStage(${stageId})">← Back to Stage</button>
      </div>
    `;

    this.charEls = [...document.querySelectorAll("#typingText .char")];
  },

  startFocus() {
    document.getElementById("focusPrompt").style.display = "none";
    document.getElementById("typingArea").classList.add("active");
    document.getElementById("hiddenInput").focus();
    if (!this.typingActive && !this.startTime) {
      this.showCountdown(() => {
        this.typingActive = true;
        this.startTime = Date.now();
        this.timerInterval = setInterval(() => this.tick(), 200);
      });
    }
  },

  showCountdown(cb) {
    const overlay = document.getElementById("countdownOverlay");
    const numEl = document.getElementById("countdownNumber");
    overlay.classList.add("show");
    let count = 3;
    numEl.textContent = count;
    const interval = setInterval(() => {
      count--;
      if (count > 0) {
        numEl.textContent = count;
        numEl.style.animation = "none";
        void numEl.offsetWidth;
        numEl.style.animation = "countPulse 0.5s ease";
      } else {
        clearInterval(interval);
        overlay.classList.remove("show");
        cb();
      }
    }, 700);
  },

  // ── Input ──
  setupInput() {
    const input = document.getElementById("hiddenInput");

    document.addEventListener("keydown", (e) => {
      if (this.view !== "typing") return;
      // Allow Enter/Space to start session when focus prompt is visible
      if (!this.typingActive) {
        const prompt = document.getElementById("focusPrompt");
        if (prompt && prompt.style.display !== "none" && (e.key === " " || e.key === "Enter")) {
          e.preventDefault();
          this.startFocus();
        }
        return;
      }
      if (e.key === "Tab") { e.preventDefault(); return; }
      input.focus();
    });

    // Composition support (dead keys for accented chars like ´+c=ç)
    this.composing = false;
    input.addEventListener("compositionstart", () => { this.composing = true; });
    input.addEventListener("compositionend", (e) => {
      this.composing = false;
      if (this.typingActive && e.data) {
        for (const ch of e.data) this.handleChar(ch);
      }
      input.value = "";
    });

    input.addEventListener("keydown", (e) => {
      if (!this.typingActive) {
        if (e.key === " " || e.key === "Enter") {
          e.preventDefault();
          const prompt = document.getElementById("focusPrompt");
          if (prompt && prompt.style.display !== "none") this.startFocus();
        }
        return;
      }

      // Skip char handling while composing — compositionend will deliver the result
      if (this.composing) return;

      if (e.key === "Backspace") {
        e.preventDefault();
        if (this.cursor > 0) {
          this.cursor--;
          this.charEls[this.cursor].className = "char current";
          if (this.cursor + 1 < this.charEls.length)
            this.charEls[this.cursor + 1].className = "char pending";
          this.clearKeyHighlights();
          this.highlightKey(this.chars[this.cursor]);
        }
        return;
      }

      if (e.key.length !== 1) return; // ignore modifier keys
      e.preventDefault();

      this.handleChar(e.key);
    });

    // mobile input
    input.addEventListener("input", (e) => {
      if (!this.typingActive || !e.data || this.composing) return;
      this.handleChar(e.data);
      input.value = "";
    });
  },

  handleChar(ch) {
    if (this.cursor >= this.chars.length) return;

    this.totalTyped++;
    const expected = this.chars[this.cursor];
    const correct = ch === expected;

    this.charEls[this.cursor].className = `char ${correct ? 'correct' : 'incorrect'}`;
    if (!correct) {
      this.errors++;
      this.combo = 0;
      // Track error key
      const d = Store.get();
      const ek = expected.toLowerCase();
      d.errorKeys[ek] = (d.errorKeys[ek] || 0) + 1;
      Store.save();
    } else {
      this.combo++;
      if (this.combo > this.maxCombo) this.maxCombo = this.combo;
    }
    this.updateComboUI();

    this.cursor++;

    if (this.cursor < this.chars.length) {
      this.charEls[this.cursor].className = "char current";
      this.highlightKey(this.chars[this.cursor]);
    }

    this.updateLiveStats();
    this.flashKey(ch, correct);

    if (this.cursor >= this.chars.length) {
      this.finishLesson();
    }
  },

  updateComboUI() {
    const kb = document.getElementById("keyboard");
    const comboEl = document.getElementById("comboCounter");
    if (!kb || !comboEl) return;

    // Remove all combo classes
    kb.classList.remove("combo-1", "combo-5", "combo-10", "combo-20", "combo-50");

    if (this.combo >= 50) {
      kb.classList.add("combo-50");
      comboEl.textContent = `🔥 ${this.combo}`;
      comboEl.className = "combo-counter combo-50-text";
    } else if (this.combo >= 20) {
      kb.classList.add("combo-20");
      comboEl.textContent = `⚡ ${this.combo}`;
      comboEl.className = "combo-counter combo-20-text";
    } else if (this.combo >= 10) {
      kb.classList.add("combo-10");
      comboEl.textContent = `✨ ${this.combo}`;
      comboEl.className = "combo-counter combo-10-text";
    } else if (this.combo >= 5) {
      kb.classList.add("combo-5");
      comboEl.textContent = `💫 ${this.combo}`;
      comboEl.className = "combo-counter combo-5-text";
    } else if (this.combo >= 1) {
      kb.classList.add("combo-1");
      comboEl.textContent = `${this.combo}`;
      comboEl.className = "combo-counter combo-1-text";
    } else {
      comboEl.textContent = "";
      comboEl.className = "combo-counter";
    }
  },

  updateLiveStats() {
    if (!this.startTime) return;
    const elapsed = (Date.now() - this.startTime) / 1000 / 60; // minutes
    const correctChars = this.cursor - this.errors;
    this.wpm = elapsed > 0 ? Math.round((correctChars / 5) / elapsed) : 0;
    this.accuracy = this.totalTyped > 0 ? Math.round(((this.totalTyped - this.errors) / this.totalTyped) * 100) : 100;
    document.getElementById("liveWpm").textContent = this.wpm;
    document.getElementById("liveAccuracy").textContent = this.accuracy + "%";
    document.getElementById("liveErrors").textContent = this.errors;
  },

  tick() {
    if (!this.startTime) return;
    this.elapsed = Math.floor((Date.now() - this.startTime) / 1000);
    const min = Math.floor(this.elapsed / 60);
    const sec = this.elapsed % 60;
    document.getElementById("timer").textContent = `${min}:${sec.toString().padStart(2, '0')}`;
    this.updateLiveStats();

    // Auto-finish at 5 min
    if (this.elapsed >= this.lessonDuration) {
      this.finishLesson();
    }
  },

  flashKey(ch, correct) {
    const key = ch.toLowerCase();
    const el = document.querySelector(`.kb-key[data-key="${CSS.escape(key)}"]`);
    if (!el) return;
    el.classList.add(correct ? "correct" : "wrong");
    setTimeout(() => el.classList.remove("correct", "wrong"), 300);
    // Flash finger bar
    const finger = el.getAttribute("data-finger");
    if (finger) {
      const bar = document.getElementById(`finger-${finger}`);
      if (bar) {
        bar.style.opacity = '1';
        bar.style.transform = 'scaleY(1.2)';
        setTimeout(() => { bar.style.opacity = ''; bar.style.transform = ''; }, 300);
      }
    }
  },

  highlightKey(ch) {
    this.clearKeyHighlights();
    const key = ch.toLowerCase();
    const el = document.querySelector(`.kb-key[data-key="${CSS.escape(key)}"]`);
    if (el) {
      el.classList.add("active");
      // Highlight finger bar in hand diagram
      const finger = el.getAttribute("data-finger");
      if (finger) {
        const bar = document.getElementById(`finger-${finger}`);
        if (bar) bar.classList.add("active");
      }
    }
  },

  clearKeyHighlights() {
    document.querySelectorAll(".kb-key.active").forEach(el => el.classList.remove("active"));
    document.querySelectorAll(".finger-bar.active").forEach(el => el.classList.remove("active"));
  },

  // ── Finish ──
  finishLesson() {
    this.typingActive = false;
    clearInterval(this.timerInterval);
    this.clearKeyHighlights();

    const stageId = this.currentStage.id;
    const lessonId = this.isTest ? "test" : this.currentLesson.id;
    const stage = this.currentStage;
    const d = Store.get();

    const accuracy = this.accuracy;
    const wpm = this.wpm;
    const stars = this.isTest
      ? this.calcStars(wpm, accuracy, stage.test.minWpm, stage.test.minAccuracy)
      : this.calcStars(wpm, accuracy, 20, 85);
    const xp = this.calcXp(wpm, accuracy, stars);

    this.recordPractice();
    this.addXp(xp);

    // Update best stats
    if (wpm > d.bestWpm) d.bestWpm = wpm;
    if (accuracy > d.bestAccuracy) d.bestAccuracy = accuracy;

    // Record history
    d.history.push({
      date: new Date().toISOString(),
      themeId: this.currentTheme,
      lessonId, stageId, wpm, accuracy, xp, stars,
      maxCombo: this.maxCombo,
      totalChars: this.totalTyped,
      errorCount: this.errors,
    });

    let passed = true;
    if (this.isTest) {
      if (wpm < stage.test.minWpm || accuracy < stage.test.minAccuracy) {
        passed = false;
      } else {
        if (!d.clearedStages.includes(stageId)) {
          d.clearedStages.push(stageId);
        }
      }
    } else {
      d.totalLessons++;
      const existing = d.completedLessons[lessonId];
      if (!existing || wpm > existing.bestWpm || accuracy > existing.bestAccuracy) {
        d.completedLessons[lessonId] = {
          bestWpm: Math.max(wpm, existing?.bestWpm || 0),
          bestAccuracy: Math.max(accuracy, existing?.bestAccuracy || 0),
          stars: Math.max(stars, existing?.stars || 0),
          attempts: (existing?.attempts || 0) + 1,
        };
      } else {
        d.completedLessons[lessonId].attempts++;
      }
    }

    Store.save();
    this.checkBadges();
    this.renderSidebar();

    // Show modal
    this.showResults(wpm, accuracy, stars, xp, passed);
  },

  showResults(wpm, accuracy, stars, xp, passed) {
    const starStr = "★".repeat(stars) + "☆".repeat(5 - stars);
    const isTest = this.isTest;
    const stage = this.currentStage;
    const stageId = stage.id;

    let title, subtitle, icon;
    if (isTest) {
      if (passed) {
        icon = "🎉"; title = "Stage Cleared!";
        subtitle = `You passed the ${stage.title} test!`;
      } else {
        icon = "💪"; title = "Not Quite...";
        subtitle = `Need ${stage.test.minWpm}+ WPM and ${stage.test.minAccuracy}%+ accuracy. Try again!`;
      }
    } else {
      if (stars >= 4) { icon = "🌟"; title = "Outstanding!"; }
      else if (stars >= 3) { icon = "🎉"; title = "Great Job!"; }
      else if (stars >= 2) { icon = "👍"; title = "Well Done!"; }
      else { icon = "💪"; title = "Keep Practicing!"; }
      subtitle = this.currentLesson ? this.currentLesson.title : "Practice complete";
    }

    const nextLessonId = !isTest ? this.getNextLessonId() : null;
    const allLessonsDone = stage.lessons.every(l => Store.get().completedLessons[l.id]);
    const stages = getStages(this.currentTheme);

    // Build action buttons with keyboard shortcut hints
    const actions = [];
    if (!isTest && nextLessonId) {
      actions.push({ key: "1", label: "Next Lesson →", primary: true, action: `App.closeModal();App.startLesson(${stageId},'${nextLessonId}')` });
    }
    if (isTest && !passed) {
      actions.push({ key: "1", label: "Retry Test", primary: true, action: `App.closeModal();App.startTest(${stageId})` });
    }
    if (isTest && passed && stageId < stages.length) {
      actions.push({ key: "1", label: "Next Stage →", primary: true, action: `App.closeModal();App.openStage(${stageId + 1})` });
    }
    if (isTest && allLessonsDone && !passed) {
      actions.push({ key: "1", label: "Retry Test", primary: true, action: `App.closeModal();App.startTest(${stageId})` });
    }
    actions.push({ key: "2", label: "Stage Menu", primary: false, action: `App.closeModal();App.openStage(${stageId})` });
    actions.push({ key: "3", label: "Dashboard", primary: false, action: `App.closeModal();App.showDashboard()` });

    // Store actions for keyboard handler
    this._modalActions = actions;

    document.getElementById("modal").innerHTML = `
      <div class="modal-icon">${icon}</div>
      <div class="modal-title">${title}</div>
      <div class="modal-subtitle">${subtitle}</div>
      <div class="modal-stars" style="color:var(--gold)">${starStr}</div>
      <div class="modal-stats">
        <div class="modal-stat">
          <div class="modal-stat-value" style="color:var(--accent)">${wpm}</div>
          <div class="modal-stat-label">WPM</div>
        </div>
        <div class="modal-stat">
          <div class="modal-stat-value" style="color:var(--green)">${accuracy}%</div>
          <div class="modal-stat-label">Accuracy</div>
        </div>
        <div class="modal-stat">
          <div class="modal-stat-value" style="color:var(--gold)">${this.maxCombo}</div>
          <div class="modal-stat-label">Best Combo</div>
        </div>
      </div>
      <div class="modal-xp">✨ ${xp} XP Earned</div>
      <div class="modal-actions">
        ${actions.map(a => `<button class="btn ${a.primary ? 'btn-primary' : 'btn-secondary'}" onclick="${a.action}"><kbd class="modal-kbd">${a.key}</kbd> ${a.label}</button>`).join('')}
      </div>
      <div style="text-align:center;margin-top:16px;font-size:0.7rem;color:var(--text-muted)">Press <kbd class="modal-kbd">1</kbd> <kbd class="modal-kbd">2</kbd> <kbd class="modal-kbd">3</kbd> or click</div>
    `;
    document.getElementById("modalOverlay").classList.add("show");

    // Keyboard handler for modal
    this._modalKeyHandler = (e) => {
      if (!document.getElementById("modalOverlay").classList.contains("show")) return;
      const action = this._modalActions.find(a => a.key === e.key);
      if (action) {
        e.preventDefault();
        eval(action.action);
      }
    };
    document.addEventListener("keydown", this._modalKeyHandler);
  },

  getNextLessonId() {
    if (!this.currentStage || !this.currentLesson) return null;
    const lessons = this.currentStage.lessons;
    const idx = lessons.findIndex(l => l.id === this.currentLesson.id);
    if (idx < lessons.length - 1) return lessons[idx + 1].id;
    return null;
  },

  closeModal() {
    document.getElementById("modalOverlay").classList.remove("show");
    if (this._modalKeyHandler) {
      document.removeEventListener("keydown", this._modalKeyHandler);
      this._modalKeyHandler = null;
    }
  },

  stopTyping() {
    this.typingActive = false;
    if (this.timerInterval) { clearInterval(this.timerInterval); this.timerInterval = null; }
  },

  // ── Badges View ──
  showBadges() {
    this.view = "badges";
    this.stopTyping();
    const d = Store.get();
    const el = document.getElementById("content");
    document.getElementById("breadcrumb").innerHTML = "Typrr — <span>Badges</span>";
    el.innerHTML = `
      <div class="dashboard-title">🏅 Achievements</div>
      <div class="dashboard-subtitle">${d.badges.length} of ${BADGES.length} unlocked</div>
      <div class="badges-grid">
        ${BADGES.map(b => {
          const earned = d.badges.includes(b.id);
          return `<div class="badge-card ${earned ? 'earned' : 'locked'}">
            <div class="badge-card-icon">${earned ? b.icon : '🔒'}</div>
            <div class="badge-card-name">${b.name}</div>
            <div class="badge-card-desc">${b.desc}</div>
          </div>`;
        }).join("")}
      </div>
    `;
  },

  // ── History View ──
  showHistory() {
    this.view = "history";
    this.stopTyping();
    const d = Store.get();
    const el = document.getElementById("content");
    document.getElementById("breadcrumb").innerHTML = "Typrr — <span>History</span>";

    const history = [...d.history].reverse().slice(0, 50);

    el.innerHTML = `
      <div class="dashboard-title">📜 Practice History</div>
      <div class="dashboard-subtitle">${d.history.length} total sessions</div>
      ${history.length === 0 ? '<div style="text-align:center;color:var(--text-muted);padding:60px">No practice sessions yet. Start your first lesson!</div>' : `
        <div class="history-list">
          ${history.map(h => {
            let stage = null, lesson = null;
            for (const tid of THEME_ORDER) {
              stage = getStages(tid).find(s => s.id === h.stageId);
              if (stage) { lesson = stage.lessons.find(l => l.id === h.lessonId); break; }
            }
            const themeLabel = h.themeId ? THEMES[h.themeId]?.name : "";
            const name = h.lessonId === "test" ? `${stage?.title || ""} Test` : lesson?.title || h.lessonId;
            const stars = "★".repeat(h.stars) + "☆".repeat(5 - h.stars);
            return `<div class="history-item">
              <div class="history-date">${new Date(h.date).toLocaleDateString()}</div>
              <div class="history-lesson">${name}</div>
              <div class="history-wpm">${h.wpm} wpm</div>
              <div class="history-accuracy">${h.accuracy}%</div>
              <div class="history-stars">${stars}</div>
            </div>`;
          }).join("")}
        </div>
      `}
    `;
  },
};

// Boot
App.init();
</script>
</body>
</html>
