    this.applyTheme();
    this.updateStreak();
    this.renderViewNav();
    this.renderSidebar();
    this.showDashboard();
    this.setupInput();
    this.setupGlobalKeys();
    this.setupDelegation();
  },

  // ── Streak ──
  updateStreak() {
    const d = Store.get();
    const today = new Date().toDateString();
    if (d.lastPractice === today) return;
    const yesterday = new Date(Date.now() - 86400000).toDateString();
    if (d.lastPractice !== yesterday) d.streak = 0;
    Store.save();
  },

  recordPractice() {
    const d = Store.get();
    const today = new Date().toDateString();
    if (d.lastPractice !== today) {
      const yesterday = new Date(Date.now() - 86400000).toDateString();
      d.streak = d.lastPractice === yesterday ? d.streak + 1 : 1;
      d.lastPractice = today;
    }
    const h = new Date().getHours();
    if (h >= 22) d.practicedLate = true;
    if (h < 7) d.practicedEarly = true;
    Store.save();
    this.updateStreakUI();
  },

  // ── XP ──
  xpForLevel(lvl) { return 100 + (lvl - 1) * 50; },

  addXp(amount) {
    const d = Store.get();
    d.xp += amount;
    while (d.xp >= this.xpForLevel(d.level)) {
      d.xp -= this.xpForLevel(d.level);
      d.level++;
    }
    Store.save();
    this.updateXpUI();
  },

  calcXp(wpm, accuracy, stars) {
    let base = Math.round(wpm * 2 + accuracy);
    if (stars >= 3) base = Math.round(base * 1.5);
    if (stars >= 5) base = Math.round(base * 2);
    return Math.max(10, base);
  },

  calcStars(wpm, accuracy, minWpm, minAccuracy) {
    let stars = 1;
    if (accuracy >= minAccuracy) stars = 2;
    if (accuracy >= minAccuracy + 2 && wpm >= minWpm) stars = 3;
    if (accuracy >= minAccuracy + 5 && wpm >= minWpm + 10) stars = 4;
    if (accuracy >= 98 && wpm >= minWpm + 20) stars = 5;
    return stars;
  },

  // ── Badges ──
  checkBadges() {
    const d = Store.get();
    const stats = {
      totalLessons: d.totalLessons,
      stagesCleared: d.clearedStages.length,
      bestWpm: d.bestWpm,
      bestAccuracy: d.bestAccuracy,
      streak: d.streak,
      practicedLate: d.practicedLate,
      practicedEarly: d.practicedEarly,
    };
    const newBadges = [];
    for (const b of BADGES) {
      if (!d.badges.includes(b.id) && b.check(stats)) {
        d.badges.push(b.id);
        newBadges.push(b);
      }
    }
    Store.save();
    if (newBadges.length) this.showAchievement(newBadges[0]);
  },

  showAchievement(badge) {
    const el = document.getElementById("achievementPopup");
    document.getElementById("achievementIcon").textContent = badge.icon;
    document.getElementById("achievementName").textContent = badge.name;
    document.getElementById("achievementDesc").textContent = badge.desc;
    el.classList.add("show");
    clearTimeout(this._achievementTimer);
    this._achievementTimer = setTimeout(() => el.classList.remove("show"), 4000);
  },

  // ── Chrome ──
  renderViewNav() {
    document.getElementById("viewNav").innerHTML = VIEWS.map(v =>
      `<button class="view-btn" data-act="view" data-arg="${v.id}" data-view="${v.id}">
        <kbd>g${v.key}</kbd><span>${v.label}</span>
      </button>`).join('');
  },

  setViewChrome(viewId, crumbs, hints) {
    this.view = viewId;
    document.querySelectorAll('.view-btn').forEach(b =>
      b.classList.toggle('active', b.dataset.view === viewId));

    document.getElementById("breadcrumb").innerHTML = crumbs.map((c, i) => {
      const sep = i ? '<span class="sep">/</span>' : '';
      return c.act
        ? `${sep}<button data-act="${c.act}" data-arg="${c.arg ?? ''}">${esc(c.label)}</button>`
        : `${sep}<span class="current">${esc(c.label)}</span>`;
    }).join('');

    const hintRows = (hints || []).concat([['Esc', 'back'], ['?', 'shortcuts']]);
    const seen = new Set();
    document.getElementById("hintbar").innerHTML = hintRows
      .filter(([k]) => !seen.has(k) && seen.add(k))
      .map(([k, t]) => `<span><kbd>${esc(k)}</kbd> ${esc(t)}</span>`).join('');

    document.getElementById("sidebar").classList.remove("open");
    // Restore only what the app collapsed for a session; an explicit
    // preference survives leaving the typing view.
    if (viewId !== "typing" && this.autoCollapsed) {
      this.autoCollapsed = false;
      this.setSidebar(false);
    }
    this.syncSidebarToggle();
    this.indexNavItems();
  },

  // Assigns 1-9 quick-launch numbers and roving tabindex to the current view's items.
  indexNavItems() {
    const items = this.navItems();
    items.forEach((el, i) => {
      el.tabIndex = i === 0 ? 0 : -1;
      const slot = el.querySelector(".card-corner-key");
      if (slot) slot.textContent = i < 9 ? String(i + 1) : "";
    });
  },

  navItems() {
    return [...document.querySelectorAll('#content [data-nav]')].filter(el => !el.disabled);
  },

  renderSidebar() {
    const d = Store.get();
    let html = `<div class="nav-section-title">Typing Kits <kbd>t</kbd></div>`;
    html += `<button class="kit-hub-btn" data-act="view" data-arg="kits" title="Browse and manage typing kits">🧩 Kit Hub</button>`;

    const enabled = d.enabledKits || THEME_ORDER;
    for (const tid of enabled) {
      const t = THEMES[tid];
      const stages = t.stages;
      const cleared = stages.filter(s => d.clearedStages.includes(stageKey(tid, s.id))).length;
      const total = stages.reduce((sum, s) => sum + s.lessons.length, 0);
      const done = stages.reduce((sum, s) => sum + s.lessons.filter(l => d.completedLessons[lessonKey(tid, l.id)]).length, 0);
      const kitDone = stages.length > 0 && cleared === stages.length;
      html += `<button class="nav-item ${tid === this.currentTheme ? 'active' : ''} ${kitDone ? 'completed' : ''}" data-act="theme" data-arg="${tid}" ${tid === this.currentTheme ? 'aria-current="true"' : ''}>
        <span class="nav-item-icon">${t.icon}</span>
        <span class="nav-item-text">
          <span class="nav-item-title">${esc(t.name)}</span>
          <span class="nav-item-sub">${done}/${total} lessons · ${cleared}/${stages.length} cleared</span>
        </span>
        ${kitDone ? '<span class="nav-item-badge badge-done">✓</span>' : ''}
      </button>`;
    }

    const stages = getStages(this.currentTheme);
    html += `<div class="nav-section-title">${esc(THEMES[this.currentTheme].name)}</div>`;
    for (const stage of stages) {
      const cleared = d.clearedStages.includes(stageKey(this.currentTheme, stage.id));
      const prevCleared = stage.id === 1 || d.clearedStages.includes(stageKey(this.currentTheme, stage.id - 1));
      const locked = !prevCleared && !cleared;
      const count = stage.lessons.length;
      const doneCount = stage.lessons.filter(l => d.completedLessons[lessonKey(this.currentTheme, l.id)]).length;

      let badge = '';
      if (cleared) badge = `<span class="nav-item-badge badge-done">✓</span>`;
      else if (stage.test && prevCleared && doneCount >= count) badge = `<span class="nav-item-badge badge-test">TEST</span>`;
      else if (!locked && doneCount === 0) badge = `<span class="nav-item-badge badge-new">NEW</span>`;

      html += `<button class="nav-item ${locked ? '' : cleared ? 'completed' : 'current'}" data-act="stage" data-arg="${stage.id}" ${locked ? 'disabled aria-disabled="true"' : ''}>
        <span class="nav-item-icon">${locked ? '🔒' : stage.icon}</span>
        <span class="nav-item-text">
          <span class="nav-item-title">${esc(stage.title)}</span>
          <span class="nav-item-sub">${cleared ? count : doneCount}/${count} lessons</span>
        </span>
        ${badge}
      </button>`;
    }

    document.getElementById("nav").innerHTML = html;
    this.updateXpUI();
    this.updateStreakUI();
    this.updateSideStats();
  },

  switchTheme(themeId) {
    if (!THEMES[themeId]) return;
    this.currentTheme = themeId;
    this.renderSidebar();
    this.showDashboard();
  },

  cycleTheme(step) {
    const enabled = Store.get().enabledKits || THEME_ORDER;
    const i = enabled.indexOf(this.currentTheme);
    this.switchTheme(enabled[(i + step + enabled.length) % enabled.length]);
  },

  // ── Sidebar ──
  // Desktop collapses the rail; phones slide the same panel as a drawer.
  // One control, one mental model, two mechanics.
  isMobile() { return window.matchMedia("(max-width: 768px)").matches; },

  sidebarHidden() {
    return this.isMobile()
      ? !document.getElementById("sidebar").classList.contains("open")
      : document.documentElement.classList.contains("sidebar-collapsed");
  },

  setSidebar(hidden, persist) {
    if (this.isMobile()) {
      document.getElementById("sidebar").classList.toggle("open", !hidden);
    } else {
      document.documentElement.classList.toggle("sidebar-collapsed", hidden);
      if (persist) { Store.get().sidebarCollapsed = hidden; Store.save(); }
    }
    this.syncSidebarToggle();
  },

  toggleSidebar() {
    const hidden = !this.sidebarHidden();
    this.autoCollapsed = false;   // an explicit choice outranks the session
    this.setSidebar(hidden, true);
  },

  syncSidebarToggle() {
    const shown = !this.sidebarHidden();
    const btn = document.getElementById("sidebarToggle");
    btn.setAttribute("aria-expanded", String(shown));
    btn.setAttribute("aria-label", shown ? "Hide sidebar" : "Show sidebar");
  },

  // ── Colour theme ──
  // Store.data.theme is null until the user picks one, so the OS preference
  // keeps winning for anyone who never touches the cord. The cord cycles
  // light → sepia → dark → light.
  THEME_CYCLE: ["light", "sepia", "dark"],
  resolvedTheme() {
    const saved = Store.get().theme;
    if (this.THEME_CYCLE.includes(saved)) return saved;
    return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  },

  applyTheme() {
    const theme = this.resolvedTheme();
    document.documentElement.dataset.theme = theme;
    PullCord.setState(theme);
    // The media-scoped <meta name="theme-color"> tags only track the OS, so a
    // single overriding tag carries the resolved choice to the OS chrome.
    let meta = document.getElementById("themeColor");
    if (!meta) {
      meta = document.createElement("meta");
      meta.id = "themeColor";
      meta.name = "theme-color";
      document.head.appendChild(meta);
    }
    meta.content = { light: "#ffffff", sepia: "#f2e7cf", dark: "#0e1116" }[theme];
  },

  toggleTheme() {
    const order = this.THEME_CYCLE;
    Store.get().theme = order[(order.indexOf(this.resolvedTheme()) + 1) % order.length];
    Store.save();
    this.applyTheme();
  },

  updateXpUI() {
    const d = Store.get();
    const need = this.xpForLevel(d.level);
    const percent = Math.round((d.xp / need) * 100);
    document.getElementById("xpLevel").textContent = `Level ${d.level}`;
    document.getElementById("xpCount").textContent = `${d.xp} / ${need} XP`;
    document.getElementById("xpBarFill").style.width = `${percent}%`;
    document.getElementById("xpProgress").setAttribute("aria-valuenow", percent);
  },

  updateStreakUI() {
    const d = Store.get();
    document.getElementById("streakCount").textContent = d.streak;
    document.getElementById("streakBadge").hidden = d.streak === 0;
    document.getElementById("sideStreak").textContent = d.streak;
  },

  updateSideStats() {
    const d = Store.get();
    document.getElementById("sideWpm").textContent = d.bestWpm;
    const attempts = d.history.length;
    const avgAcc = attempts ? Math.round(d.history.reduce((s, h) => s + h.accuracy, 0) / attempts) : 0;
    document.getElementById("sideAccuracy").textContent = avgAcc + "%";
  },

  // ── Next recommended target ──
  nextTarget() {
    const d = Store.get();
    const stages = getStages(this.currentTheme);
    for (const stage of stages) {
      if (d.clearedStages.includes(stageKey(this.currentTheme, stage.id))) continue;
      const prevCleared = stage.id === 1 || d.clearedStages.includes(stageKey(this.currentTheme, stage.id - 1));
      if (!prevCleared) break;
      const pending = stage.lessons.find(l => !d.completedLessons[lessonKey(this.currentTheme, l.id)]);
      if (pending) return { stage, lesson: pending, isTest: false };
      if (stage.test) return { stage, lesson: null, isTest: true };
    }
    const last = stages[stages.length - 1];
    return { stage: last, lesson: last.lessons[0], isTest: false };
  },

  startNext() {
    const t = this.nextTarget();
    if (t.isTest) this.startTest(t.stage.id);
    else this.startLesson(t.stage.id, t.lesson.id);
  },

  // ── Dashboard ──
  showDashboard() {
    this.stopTyping();
    const d = Store.get();
    const stages = getStages(this.currentTheme);
    const theme = THEMES[this.currentTheme];
    this.setViewChrome("dashboard", [{ label: 'Typrr', act: 'view', arg: 'dashboard' }, { label: 'Dashboard' }],
      [['n', 'next lesson'], ['j', 'k', 'move'], ['gk', 'kit hub']]);

    const target = this.nextTarget();
    const enabled = d.enabledKits || THEME_ORDER;

    // ── Aggregates (general — used by the greeting, kit strip and discover) ──
    const hist = d.history;
    const avgWpm = arr => arr.length ? Math.round(arr.reduce((s, r) => s + r.wpm, 0) / arr.length) : null;
    const avgAcc = arr => arr.length ? Math.round(arr.reduce((s, r) => s + r.accuracy, 0) / arr.length) : null;
    const weekAgo = Date.now() - 7 * 864e5;
    const thisWeek = hist.filter(r => new Date(r.date).getTime() >= weekAgo).length;
    const lessonsOf = t => t.stages.reduce((s, st) => s + st.lessons.length, 0);
    const doneOf = tid => THEMES[tid].stages.reduce((s, st) => s + st.lessons.filter(l => d.completedLessons[lessonKey(tid, l.id)]).length, 0);

    // ── This kit only — Progress and Your evolution reflect the current kit ──
    const kitHist = hist.filter(r => r.themeId === this.currentTheme);
    const kitLast5 = kitHist.slice(-5), kitPrev5 = kitHist.slice(-10, -5);
    const kitBestWpm = kitHist.length ? Math.max(...kitHist.map(r => r.wpm)) : 0;
    const kitBestAcc = kitHist.length ? Math.max(...kitHist.map(r => r.accuracy)) : 0;
    const kitWeek = kitHist.filter(r => new Date(r.date).getTime() >= weekAgo).length;
    const kitTotal = lessonsOf(theme);
    const kitDone = doneOf(this.currentTheme);

    const need = this.xpForLevel(d.level);
    const xpPct = Math.round((d.xp / need) * 100);
    const hour = new Date().getHours();
    const greet = hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';
    const insight = d.streak > 1
      ? `You're on a <strong>${d.streak}-day streak</strong> — ${thisWeek} session${thisWeek === 1 ? '' : 's'} this week. Keep the momentum.`
      : hist.length
        ? `${kitDone} of ${kitTotal} lessons cleared in <strong>${esc(theme.name)}</strong>. One more today keeps you sharp.`
        : 'Your first lesson is one keystroke away. Build the habit today.';

    const kitRecent = kitHist.slice(-14);
    const spark = kitRecent.length > 1 ? `<div class="panel">
        <div class="panel-head">
          <div class="panel-title">${esc(theme.name)} speed · last ${kitRecent.length} sessions</div>
          <div class="panel-note">peak ${Math.max(...kitRecent.map(r => r.wpm))} · latest ${kitRecent[kitRecent.length - 1].wpm} wpm</div>
        </div>
        ${lineChart(kitRecent.map(r => ({ value: r.wpm, label: new Date(r.date).toLocaleDateString() })), { color: 'var(--accent)', unit: ' wpm', id: 'dash', aria: 'WPM trend' })}
      </div>` : `<div class="empty"><div class="empty-icon">📈</div><div class="empty-title">No trend yet in ${esc(theme.name)}</div><div class="empty-desc">Finish two sessions in this kit to unlock its evolution chart.</div></div>`;

    // ── Installed kits strip ──
    const kitStrip = enabled.map(tid => {
      const t = THEMES[tid];
      const total = lessonsOf(t), done = doneOf(tid);
      const p = pct(done, total);
      return `<button class="kit-strip-row ${tid === this.currentTheme ? 'active' : ''}" data-act="theme" data-arg="${tid}" data-nav>
        <span class="kit-strip-icon">${t.icon}</span>
        <span class="kit-strip-body">
          <span class="kit-strip-name">${esc(t.name)}</span>
          <span class="kit-strip-meta">${done}/${total} lessons · ${t.stages.length} stages</span>
        </span>
        <span class="kit-strip-track"><span class="progress-fill ${p === 100 ? 'done' : ''}" style="width:${p}%"></span></span>
        <span class="kit-strip-pct">${p}%</span>
      </button>`;
    }).join('');

    // ── Discover: kits not yet installed, a rotating sample ──
    const notInstalled = THEME_ORDER.filter(tid => !enabled.includes(tid));
    const sample = notInstalled.slice(0, 3);
    const discover = sample.map(tid => {
      const t = THEMES[tid];
      const cat = KIT_CATEGORIES.find(c => c.id === t.category);
      return `<div class="hub-card">
        <button class="hub-card-detail" data-act="kit-detail" data-arg="${tid}" data-nav>
          <span class="card-corner-key"></span>
          <span class="hub-card-cover">
            <span class="hub-card-icon">${t.icon}</span>
            <span class="hub-card-heading">
              <span class="hub-card-name">${esc(t.name)}</span>
              <span class="hub-card-flag">${cat ? esc(cat.name) : 'Kit'}</span>
            </span>
          </span>
          <span class="hub-card-desc">${esc(t.desc)}</span>
          <span class="hub-card-chips">
            <span class="hub-chip">${t.stages.length} stages</span>
            <span class="hub-chip">${lessonsOf(t)} lessons</span>
          </span>
        </button>
        <button class="hub-card-action" data-act="kit-toggle" data-arg="${tid}">⬇ Download</button>
      </div>`;
    }).join('');

    document.getElementById("content").innerHTML = `
      <div class="dash-hero">
        <div>
          <h1 class="dash-hero-greeting">${greet} 👋</h1>
          <p class="dash-hero-sub">${insight}</p>
        </div>
        <div class="dash-level">
          <div class="dash-level-row">
            <span class="dash-level-num">Level ${d.level}</span>
            <span class="dash-level-xp">${d.xp} / ${need} XP</span>
          </div>
          <span class="dash-xp-track"><span class="dash-xp-fill" style="width:${xpPct}%"></span></span>
        </div>
      </div>

      <button class="continue-card" data-act="${target.isTest ? 'test' : 'lesson'}" data-arg="${target.stage.id}" data-arg2="${target.lesson ? target.lesson.id : ''}" data-nav>
        <span class="continue-icon">${target.isTest ? '🧪' : '▶'}</span>
        <span class="continue-body">
          <span class="continue-eyebrow">${target.isTest ? 'Stage test unlocked · recommended next' : 'Pick up where you left off'}</span>
          <span class="continue-title">${esc(target.isTest ? target.stage.test.title : target.lesson.title)}</span>
          <span class="continue-meta">${esc(theme.name)} · ${esc(target.stage.title)}</span>
        </span>
        <span class="continue-cta"><kbd>n</kbd> Start</span>
      </button>

      <div class="section-title">Your evolution <span class="count">${esc(theme.name)}</span></div>
      <div class="insight-grid">
        <div class="insight-card" style="--tone:var(--accent)">
          <div class="insight-label">Best WPM</div>
          <div class="insight-value">${kitBestWpm}</div>
          <div class="insight-foot">${kitHist.length ? (deltaChip(avgWpm(kitLast5), avgWpm(kitPrev5), '') || `last ${kitLast5.length} avg ${avgWpm(kitLast5)}`) : 'no sessions yet'}</div>
        </div>
        <div class="insight-card" style="--tone:var(--green)">
          <div class="insight-label">Best accuracy</div>
          <div class="insight-value">${kitBestAcc}<span class="unit">%</span></div>
          <div class="insight-foot">${kitHist.length ? (deltaChip(avgAcc(kitLast5), avgAcc(kitPrev5), '%') || `last ${kitLast5.length} avg ${avgAcc(kitLast5)}%`) : 'no sessions yet'}</div>
        </div>
        <div class="insight-card" style="--tone:var(--amber-fill)">
          <div class="insight-label">Kit sessions</div>
          <div class="insight-value">${kitHist.length}</div>
          <div class="insight-foot">${kitWeek} this week</div>
        </div>
        <div class="insight-card" style="--tone:var(--cyan)">
          <div class="insight-label">Lessons cleared</div>
          <div class="insight-value">${kitDone}<span class="unit">/${kitTotal}</span></div>
          <div class="insight-foot">in ${esc(theme.name)}</div>
        </div>
      </div>

      <div class="section-title">Progress <span class="count">${esc(theme.name)}</span></div>
      ${spark}

      <div class="section-head">
        <div class="section-title">Your kits <span class="count">${enabled.length}</span></div>
        <button class="section-link" data-act="view" data-arg="kits">Kit Hub →</button>
      </div>
      <div class="kit-strip">${kitStrip}</div>

      ${discover ? `<div class="section-head">
        <div class="section-title">Discover more kits</div>
        <button class="section-link" data-act="view" data-arg="kits">Browse all →</button>
      </div>
      <div class="hub-grid">${discover}</div>` : ''}

      <div class="section-title">${esc(theme.name)} stages <span class="count">${stages.length}</span></div>
      <div class="card-grid">
        ${stages.map(s => {
          const cleared = d.clearedStages.includes(stageKey(this.currentTheme, s.id));
          const prevCleared = s.id === 1 || d.clearedStages.includes(stageKey(this.currentTheme, s.id - 1));
          const locked = !prevCleared && !cleared;
          const done = s.lessons.filter(l => d.completedLessons[lessonKey(this.currentTheme, l.id)]).length;
          const p = cleared ? 100 : pct(done, s.lessons.length);
          return `<button class="card ${cleared ? 'done' : ''}" data-act="stage" data-arg="${s.id}" ${locked ? 'disabled' : 'data-nav'}>
            <span class="card-corner-key"></span>
            <span class="card-head">
              <span class="card-badge">${locked ? '🔒' : s.id}</span>
              <span>
                <span class="card-title">${esc(s.title)}</span>
                <span class="card-sub">${locked ? 'Clear the previous stage' : `${done}/${s.lessons.length} lessons`}</span>
              </span>
            </span>
            <span class="card-desc">${esc(s.desc)}</span>
            <span class="progress-track"><span class="progress-fill ${cleared ? 'done' : ''}" style="width:${p}%"></span></span>
            <span class="card-foot"><span>${p}% complete</span><span>${cleared ? '✅ cleared' : locked ? 'locked' : s.test ? '🧪 test at the end' : ''}</span></span>
          </button>`;
        }).join('')}
      </div>
    `;
    this.indexNavItems();
  },

  // ── Stats ──
  showPerformance() {
    this.stopTyping();
    const d = Store.get();
    this.setViewChrome("performance", [{ label: 'Typrr', act: 'view', arg: 'dashboard' }, { label: 'Stats' }], [['d', 'dashboard']]);

    const h = d.history;
    const sessions = h.length;
    const avgWpm = sessions ? Math.round(h.reduce((s, r) => s + r.wpm, 0) / sessions) : 0;
    const avgAcc = sessions ? Math.round(h.reduce((s, r) => s + r.accuracy, 0) / sessions) : 0;
    const totalXp = h.reduce((s, r) => s + (r.xp || 0), 0);
    const totalStars = h.reduce((s, r) => s + (r.stars || 0), 0);
    const totalChars = h.reduce((s, r) => s + (r.totalChars || 0), 0);

    if (!sessions) {
      document.getElementById("content").innerHTML = `
        <div class="page-head">
          <h1 class="page-title">📊 Stats</h1>
          <p class="page-subtitle">Speed, accuracy and consistency over time.</p>
        </div>
        <div class="empty">
          <div class="empty-icon">📊</div>
          <div class="empty-title">Nothing to measure yet</div>
          <div class="empty-desc">Finish your first lesson and your stats will appear here.</div>
        </div>`;
      this.indexNavItems();
      return;
    }

    const recent = h.slice(-20);
    const last5 = h.slice(-5), prev5 = h.slice(-10, -5);
    const mean = (arr, k) => arr.length ? Math.round(arr.reduce((s, r) => s + r[k], 0) / arr.length) : null;

    const wpmChart = recent.length > 1 ? `<div class="panel" style="margin-bottom:12px">
      <div class="panel-head">
        <div class="panel-title">Speed trend</div>
        <div class="panel-note">last ${recent.length} sessions · peak ${Math.max(...recent.map(r => r.wpm))} wpm</div>
      </div>
      ${lineChart(recent.map(r => ({ value: r.wpm, label: new Date(r.date).toLocaleDateString() })), { color: 'var(--accent)', unit: ' wpm', id: 'w', aria: 'WPM trend' })}
      <div class="chart-legend"><span><i style="background:var(--accent)"></i>WPM</span><span><i style="background:var(--amber-fill)"></i>Personal peak in range</span><span><i style="background:var(--text-muted)"></i>Average</span></div>
    </div>` : '';

    const accChart = recent.length > 1 ? `<div class="panel" style="margin-bottom:12px">
      <div class="panel-head">
        <div class="panel-title">Accuracy trend</div>
        <div class="panel-note">last ${recent.length} sessions · peak ${Math.max(...recent.map(r => r.accuracy))}%</div>
      </div>
      ${lineChart(recent.map(r => ({ value: r.accuracy, label: new Date(r.date).toLocaleDateString() })), { color: 'var(--green)', unit: '%', floorZero: false, id: 'a', aria: 'Accuracy trend' })}
    </div>` : '';

    const errorEntries = Object.entries(d.errorKeys || {}).sort((a, b) => b[1] - a[1]).slice(0, 8);
    const maxErr = errorEntries.length ? errorEntries[0][1] : 1;
    const errorHtml = errorEntries.length ? `<div class="panel">
      <div class="panel-head"><div class="panel-title">Keys you miss most</div><div class="panel-note">drill these to level up fastest</div></div>
      ${errorEntries.map(([key, count]) => `<div class="keybar-row">
        <span class="keybar-key">${key === ' ' ? '␣' : esc(key)}</span>
        <span class="keybar-track"><span class="keybar-fill" style="width:${(count / maxErr) * 100}%"></span></span>
        <span class="keybar-count">${count}×</span>
      </div>`).join('')}
    </div>` : '';

    const themeRows = THEME_ORDER.map(tid => {
      const t = THEMES[tid];
      const stages = getStages(tid);
      const done = stages.reduce((sum, s) => sum + s.lessons.filter(l => d.completedLessons[lessonKey(tid, l.id)]).length, 0);
      const total = stages.reduce((sum, s) => sum + s.lessons.length, 0);
      const cleared = stages.filter(s => d.clearedStages.includes(stageKey(tid, s.id))).length;
      const p = pct(done, total);
      return `<div class="themerow">
        <span class="themerow-icon">${t.icon}</span>
        <span class="themerow-body">
          <span class="themerow-name">${esc(t.name)}</span>
          <span class="themerow-meta">${done}/${total} lessons · ${cleared}/${stages.length} stages cleared</span>
        </span>
        <span class="themerow-track"><span class="progress-fill ${p === 100 ? 'done' : ''}" style="width:${p}%"></span></span>
        <span class="themerow-pct">${p}%</span>
      </div>`;
    }).join('');

    document.getElementById("content").innerHTML = `
      <div class="page-head">
        <h1 class="page-title">📊 Stats</h1>
        <p class="page-subtitle">${sessions} sessions · Level ${d.level} · ${totalChars.toLocaleString()} characters typed</p>
      </div>

      <div class="stats-grid four">
        <div class="stat-card" style="--tone:var(--accent)">
          <div class="stat-card-label">Best WPM</div>
          <div class="stat-card-value">${d.bestWpm}</div>
          <div class="stat-card-foot">${deltaChip(mean(last5, 'wpm'), mean(prev5, 'wpm'), '') || `avg ${avgWpm} all-time`}</div>
        </div>
        <div class="stat-card" style="--tone:var(--cyan)">
          <div class="stat-card-label">Average WPM</div>
          <div class="stat-card-value">${avgWpm}</div>
          <div class="stat-card-foot">last 5: ${mean(last5, 'wpm')} wpm</div>
        </div>
        <div class="stat-card" style="--tone:var(--green)">
          <div class="stat-card-label">Best accuracy</div>
          <div class="stat-card-value">${d.bestAccuracy}<span class="unit">%</span></div>
          <div class="stat-card-foot">${deltaChip(mean(last5, 'accuracy'), mean(prev5, 'accuracy'), '%') || `avg ${avgAcc}% all-time`}</div>
        </div>
        <div class="stat-card" style="--tone:var(--red)">
          <div class="stat-card-label">Average accuracy</div>
          <div class="stat-card-value">${avgAcc}<span class="unit">%</span></div>
          <div class="stat-card-foot">last 5: ${mean(last5, 'accuracy')}%</div>
        </div>
        <div class="stat-card" style="--tone:var(--violet)">
          <div class="stat-card-label">Total XP</div>
          <div class="stat-card-value">${totalXp}</div>
          <div class="stat-card-foot">level ${d.level}</div>
        </div>
        <div class="stat-card" style="--tone:var(--gold-fill)">
          <div class="stat-card-label">Stars earned</div>
          <div class="stat-card-value">${totalStars}</div>
          <div class="stat-card-foot">${(totalStars / sessions).toFixed(1)} per session</div>
        </div>
        <div class="stat-card" style="--tone:var(--amber-fill)">
          <div class="stat-card-label">Current streak</div>
          <div class="stat-card-value">${d.streak}<span class="unit">d</span></div>
          <div class="stat-card-foot">${d.lastPractice ? 'last practice ' + esc(new Date(d.lastPractice).toLocaleDateString()) : 'not started'}</div>
        </div>
        <div class="stat-card" style="--tone:var(--pink)">
          <div class="stat-card-label">Badges</div>
          <div class="stat-card-value">${d.badges.length}<span class="unit">/${BADGES.length}</span></div>
          <div class="stat-card-foot">${pct(d.badges.length, BADGES.length)}% unlocked</div>
        </div>
      </div>

      <div class="section-title">Trends</div>
      ${wpmChart}
      ${accChart}

      <div class="section-title">Consistency</div>
      <div class="panel" style="margin-bottom:12px">
        <div class="panel-head"><div class="panel-title">Practice calendar</div><div class="panel-note">last 18 weeks</div></div>
        ${heatmap(h, 18)}
      </div>

      ${errorEntries.length ? '<div class="section-title">Weak spots</div>' + errorHtml : ''}

      <div class="section-title">Typing Kits</div>
      ${themeRows}
    `;
    this.indexNavItems();
  },

  // ── Stage ──
  openStage(stageId) {
    const d = Store.get();
    const stage = getStages(this.currentTheme).find(s => s.id === stageId);
    if (!stage) return;
    const prevCleared = stageId === 1 || d.clearedStages.includes(stageKey(this.currentTheme, stageId - 1));
    if (!prevCleared && !d.clearedStages.includes(stageKey(this.currentTheme, stageId))) return;

    this.stopTyping();
    this.currentStage = stage;
    this.setViewChrome("stage",
      [{ label: 'Typrr', act: 'view', arg: 'dashboard' }, { label: THEMES[this.currentTheme].name, act: 'view', arg: 'dashboard' }, { label: stage.title }],
      [['1-9', 'start lesson'], ['↑↓←→', 'move'], ['Enter', 'open']]);

    const cleared = d.clearedStages.includes(stageKey(this.currentTheme, stageId));
    const allDone = stage.lessons.every(l => d.completedLessons[lessonKey(this.currentTheme, l.id)]);
    const doneCount = stage.lessons.filter(l => d.completedLessons[lessonKey(this.currentTheme, l.id)]).length;

    document.getElementById("content").innerHTML = `
      <div class="kit-badge">
        <span class="kit-badge-icon">${esc(THEMES[this.currentTheme].icon)}</span>
        <span class="kit-badge-name">${esc(THEMES[this.currentTheme].name)}</span>
      </div>
      <div class="page-head">
        <h1 class="page-title">${stage.icon} ${esc(stage.title)}</h1>
        <p class="page-subtitle">${esc(stage.desc)}</p>
      </div>

      <div class="stats-grid" style="grid-template-columns:repeat(3,1fr)">
        <div class="stat-card" style="--tone:var(--accent)">
          <div class="stat-card-label">Lessons</div>
          <div class="stat-card-value">${doneCount}<span class="unit">/${stage.lessons.length}</span></div>
          <div class="stat-card-foot">${pct(doneCount, stage.lessons.length)}% complete</div>
        </div>
        <div class="stat-card" style="--tone:var(--gold-fill)">
          <div class="stat-card-label">Stars</div>
          <div class="stat-card-value">${stage.lessons.reduce((s, l) => s + (d.completedLessons[lessonKey(this.currentTheme, l.id)]?.stars || 0), 0)}<span class="unit">/${stage.lessons.length * 5}</span></div>
          <div class="stat-card-foot">best per lesson</div>
        </div>
        <div class="stat-card" style="--tone:${cleared ? 'var(--green)' : 'var(--amber-fill)'}">
          <div class="stat-card-label">Status</div>
          <div class="stat-card-value" style="font-size:1.1rem;margin-top:10px">${cleared ? '✅ Cleared' : allDone ? '🧪 Test ready' : '⏳ In progress'}</div>
          <div class="stat-card-foot">${stage.test ? `target ${stage.test.minWpm} wpm · ${stage.test.minAccuracy}%` : 'no test'}</div>
        </div>
      </div>

      <div class="section-title">Lessons <span class="count">${stage.lessons.length}</span></div>
      <div class="card-grid">
        ${stage.lessons.map((lesson, i) => {
          const cl = d.completedLessons[lessonKey(this.currentTheme, lesson.id)];
          return `<button class="card ${cl ? 'done' : ''}" data-act="lesson" data-arg="${stageId}" data-arg2="${lesson.id}" data-nav>
            <span class="card-corner-key"></span>
            <span class="card-head">
              <span class="card-badge">${i + 1}</span>
              <span>
                <span class="card-title">${esc(lesson.title)}</span>
                <span class="card-sub">${cl ? `${cl.bestWpm} wpm · ${cl.bestAccuracy}% · ${cl.attempts} ${cl.attempts === 1 ? 'try' : 'tries'}` : 'not started'}</span>
              </span>
            </span>
            <span class="card-preview">${esc(lesson.text.slice(0, 72))}…</span>
            <span class="card-foot"><span class="stars">${starHtml(cl ? cl.stars : 0)}</span><span>${lesson.text.length} chars</span></span>
          </button>`;
        }).join('')}
      </div>

      ${stage.test ? `
        <div class="section-title">Stage test</div>
        <button class="card test" data-act="test" data-arg="${stageId}" ${allDone ? 'data-nav' : 'disabled'} style="max-width:520px">
          <span class="card-corner-key"></span>
          <span class="card-head">
            <span class="card-badge">${allDone ? '🧪' : '🔒'}</span>
            <span>
              <span class="card-title">${esc(stage.test.title)}</span>
              <span class="card-sub">Pass with ${stage.test.minWpm}+ wpm and ${stage.test.minAccuracy}%+ accuracy</span>
            </span>
          </span>
          <span class="card-desc">${cleared ? '✅ Already passed — retake it any time to raise your score.' : allDone ? 'All lessons done. Clear this test to unlock the next stage.' : 'Complete every lesson in this stage to unlock the test.'}</span>
        </button>
      ` : ''}
    `;
    this.indexNavItems();
  },

  // ── Typing ──
  startLesson(stageId, lessonId) {
    const stage = getStages(this.currentTheme).find(s => s.id === stageId);
    const lesson = stage && stage.lessons.find(l => l.id === lessonId);
    if (!lesson) return;
    this.currentStage = stage;
    this.currentLesson = lesson;
    this.isTest = false;
    this.beginTyping(lesson.text, stageId);
  },

  startTest(stageId) {
    const stage = getStages(this.currentTheme).find(s => s.id === stageId);
    if (!stage || !stage.test) return;
    this.currentStage = stage;
    this.currentLesson = null;
    this.isTest = true;
    this.beginTyping(stage.test.text, stageId);
  },

  restart() {
    if (this.isTest) this.startTest(this.currentStage.id);
    else this.startLesson(this.currentStage.id, this.currentLesson.id);
  },

  beginTyping(text, stageId) {
    this.text = text;
    this.cursor = 0;
    this.errors = 0;
    this.chars = [...text];
    this.totalTyped = 0;
    this.combo = 0;
    this.maxCombo = 0;
    this.startTime = null;
    this.elapsed = 0;
    this.wpm = 0;
    this.accuracy = 100;
    this.typingActive = false;

    const stage = this.currentStage;
    const label = this.isTest ? stage.test.title : this.currentLesson.title;
    this.setViewChrome("typing",
      [{ label: 'Typrr', act: 'view', arg: 'dashboard' }, { label: stage.title, act: 'stage', arg: stage.id }, { label }],
      [['Space', 'start'], ['Esc', 'back to stage'], ['⌫', 'fix last char']]);

    const charHtml = this.chars.map((c, i) =>
      `<span class="char ${i === 0 ? 'current' : 'pending'}">${c === ' ' ? '&nbsp;' : esc(c)}</span>`).join('');

    const kbHtml = KB_ROWS.map(row => `<div class="kb-row">${row.map(k => {
      const key = k === 'space' ? ' ' : k;
      const finger = FINGER_MAP[key] || '';
      const cls = k === 'space' ? 'kb-key space' : (k.length > 1 ? 'kb-key wide' : 'kb-key');
      return `<div class="${cls}" data-key="${esc(key)}" data-finger="${finger}">${k === 'space' ? '' : esc(k)}</div>`;
    }).join('')}</div>`).join('');

    const handHtml = `<div class="hand-diagram">
      ${[FINGERS.slice(0, 4), FINGERS.slice(4)].map(hand => `<div class="hand">${hand.map(f =>
        `<div class="finger"><div class="finger-bar" id="finger-${f.id}" style="height:${f.height}px;background:${fingerVar(f.id)}"></div><div class="finger-label">${f.short}</div></div>`
      ).join('')}</div>`).join('')}
    </div>`;

    const guideHtml = `<div class="finger-guide">${FINGERS.map(f =>
      `<span class="finger-item"><span class="finger-dot" style="background:${fingerVar(f.id)}"></span>${f.name}</span>`).join('')}</div>`;

    document.getElementById("content").innerHTML = `
      <div class="kit-badge">
        <span class="kit-badge-icon">${esc(THEMES[this.currentTheme].icon)}</span>
        <span class="kit-badge-name">${esc(THEMES[this.currentTheme].name)}</span>
        <span class="kit-badge-meta">${esc(stage.title)}</span>
      </div>
      <div class="lesson-head">
        <div>
          <div class="lesson-title">${this.isTest ? '🧪' : '📖'} ${esc(label)}</div>
          <div class="lesson-sub">${this.isTest ? ` · target ${stage.test.minWpm} wpm / ${stage.test.minAccuracy}%` : ''} · ${this.chars.length} characters</div>
        </div>
        <div class="timer" id="timer" aria-label="Elapsed time">0:00</div>
      </div>

      <div class="live-stats" aria-live="off">
        <div class="live-stat wpm"><div class="live-stat-value" id="liveWpm">0</div><div class="live-stat-label">WPM</div></div>
        <div class="live-stat acc"><div class="live-stat-value" id="liveAccuracy">100%</div><div class="live-stat-label">Accuracy</div></div>
        <div class="live-stat err"><div class="live-stat-value" id="liveErrors">0</div><div class="live-stat-label">Errors</div></div>
        <div class="live-stat combo"><div class="live-stat-value" id="liveCombo">0</div><div class="live-stat-label">Combo</div></div>
      </div>

      <div class="session-progress"><div class="session-progress-fill" id="sessionProgress"></div></div>

      <div class="typing-area" id="typingArea">
        <button class="focus-prompt" id="focusPrompt" data-act="focus">
          <span class="focus-prompt-text">Press <kbd>Space</kbd> or click to start</span>
        </button>
        <div class="typing-text" id="typingText">${charHtml}</div>
      </div>

      <div class="keyboard" id="keyboard">
        <div class="combo-counter" id="comboCounter"></div>
        ${handHtml}
        ${guideHtml}
        ${kbHtml}
      </div>

      <div style="display:flex;gap:8px;justify-content:center">
        <button class="btn btn-secondary" data-act="stage" data-arg="${stageId}"><kbd>Esc</kbd> Back to stage</button>
        <button class="btn btn-secondary" data-act="restart">↻ Restart</button>
      </div>
    `;

    this.charEls = [...document.querySelectorAll("#typingText .char")];
    this.highlightKey(this.chars[0]);
    document.getElementById("focusPrompt").focus();
  },

  startFocus() {
    if (this.typingActive || this.startTime) return;
    const prompt = document.getElementById("focusPrompt");
    if (!prompt) return;
    prompt.remove();
    if (!this.sidebarHidden()) { this.autoCollapsed = true; this.setSidebar(true); }
    document.getElementById("typingArea").classList.add("active");
    document.getElementById("hiddenInput").focus();
    this.showCountdown(() => {
      this.typingActive = true;
      this.startTime = Date.now();
      document.getElementById("hiddenInput").focus();
      this.timerInterval = setInterval(() => this.tick(), 200);
    });
  },

  showCountdown(cb) {
    const overlay = document.getElementById("countdownOverlay");
    const numEl = document.getElementById("countdownNumber");
    overlay.classList.add("show");
    let count = 3;
    numEl.textContent = count;
    const interval = setInterval(() => {
      count--;
      if (count > 0) {
        numEl.textContent = count;
        numEl.style.animation = "none";
        void numEl.offsetWidth;
        numEl.style.animation = "countPulse 0.5s ease";
      } else {
        clearInterval(interval);
        overlay.classList.remove("show");
        cb();
      }
    }, 650);
  },

  // ── Event wiring ──
  setupDelegation() {
    const run = (e) => {
      const el = e.target.closest("[data-act]");
      if (!el || el.disabled) return;
      e.preventDefault();
      this.dispatch(el.dataset.act, el.dataset.arg, el.dataset.arg2);
    };
    document.getElementById("content").addEventListener("click", run);
    document.getElementById("nav").addEventListener("click", run);
    document.getElementById("viewNav").addEventListener("click", run);
    document.getElementById("breadcrumb").addEventListener("click", run);
    document.getElementById("helpBtn").addEventListener("click", () => this.toggleHelp(true));
    document.getElementById("sidebarToggle").addEventListener("click", () => this.toggleSidebar());
    document.getElementById("sidebarScrim").addEventListener("click", () => this.setSidebar(true));
  },

  dispatch(act, arg, arg2) {
    switch (act) {
      case "view": this.showView(arg); break;
      case "theme": this.switchTheme(arg); break;
      case "kit-detail": this.showKitDetail(arg); break;
      case "kit-toggle": this.toggleKit(arg); break;
      case "stage": this.openStage(Number(arg)); break;
      case "lesson": this.startLesson(Number(arg), arg2); break;
      case "test": this.startTest(Number(arg)); break;
      case "focus": this.startFocus(); break;
      case "restart": this.restart(); break;
    }
  },

  showView(id) {
    if (id === "dashboard") this.showDashboard();
    else if (id === "performance") this.showPerformance();
    else if (id === "badges") this.showBadges();
    else if (id === "kits") this.showKitHub();
    else if (id === "history") this.showHistory();
  },

  back() {
    if (this.view === "typing" && this.currentStage) this.openStage(this.currentStage.id);
    else if (this.view !== "dashboard") this.showDashboard();
  },

  // ── Global keyboard router ──
  setupGlobalKeys() {
    document.addEventListener("keydown", (e) => {
      if (e.ctrlKey || e.metaKey || e.altKey) return;

      if (document.getElementById("helpOverlay").classList.contains("show")) {
        if (e.key === "Escape" || e.key === "?") { e.preventDefault(); this.toggleHelp(false); }
        return;
      }
      if (document.getElementById("modalOverlay").classList.contains("show")) {
        if (e.key === "Escape") { e.preventDefault(); this.closeModal(); this.back(); return; }
        const action = (this._modalActions || []).find(a => a.key === e.key);
        if (action) { e.preventDefault(); action.run(); }
        return;
      }

      if (this.view === "typing") {
        if (e.key === "Escape") { e.preventDefault(); this.back(); return; }
        // Only while the focus prompt is still up: once the countdown runs the
        // user is practising and every key belongs to the lesson.
        const notStarted = document.getElementById("focusPrompt") !== null;
        if (notStarted && e.key === "c") { e.preventDefault(); this.toggleSidebar(); return; }
        if (notStarted && (e.key === " " || e.key === "Enter")) {
          e.preventDefault();
          this.startFocus();
        }
        return;
      }

      const tag = document.activeElement && document.activeElement.tagName;
      if (tag === "INPUT" || tag === "TEXTAREA") return;

      // An open drawer is the innermost layer: Escape dismisses it, not the view.
      if (e.key === "Escape" && this.isMobile() && !this.sidebarHidden()) {
        e.preventDefault();
        this.setSidebar(true);
        return;
      }

      // VIM "go" chords: g then a second key. A short window keeps gg/gd/gt snappy.
      if (this._pendingG) {
        // A bare modifier keydown (Shift for gT) must not consume the chord.
        if (["Shift", "Control", "Alt", "Meta"].includes(e.key)) return;
        this._pendingG = false;
        clearTimeout(this._gTimer);
        e.preventDefault();
        if (e.key === "g") { this.focusIndex(0); return; }        // gg — first card
        if (e.key === "t") { this.cycleTheme(1); return; }         // gt — next kit
        if (e.key === "T") { this.cycleTheme(-1); return; }        // gT — previous kit
        if (e.key === "k") { this.showKitHub(); return; }          // gk — Kit Hub
        const gv = VIEWS.find(v => v.key === e.key);               // gd/gs/gb/gh — views
        if (gv) { this.showView(gv.id); return; }
        return;
      }

      switch (e.key) {
        case "?": e.preventDefault(); this.toggleHelp(true); return;
        case "m": e.preventDefault(); PullCord.yank(); return;
        case "c": e.preventDefault(); this.toggleSidebar(); return;
        case "Escape": e.preventDefault(); this.back(); return;
        case "n": e.preventDefault(); this.startNext(); return;
        case "g": e.preventDefault(); this._pendingG = true; this._gTimer = setTimeout(() => { this._pendingG = false; }, 700); return;
        case "G": e.preventDefault(); this.focusIndex(this.navItems().length - 1); return;
        case "h": case "ArrowLeft": e.preventDefault(); this.moveFocus("prev"); return;
        case "l": case "ArrowRight": e.preventDefault(); this.moveFocus("next"); return;
        case "j": case "ArrowDown": e.preventDefault(); this.moveFocus("down"); return;
        case "k": case "ArrowUp": e.preventDefault(); this.moveFocus("up"); return;
        case "o": {
          const el = document.activeElement;
          if (el && el.matches && el.matches("[data-nav]")) { e.preventDefault(); el.click(); }
          return;
        }
        case "Home": e.preventDefault(); this.focusIndex(0); return;
        case "End": e.preventDefault(); this.focusIndex(this.navItems().length - 1); return;
      }

      if (/^[1-9]$/.test(e.key)) {
        const item = this.navItems()[Number(e.key) - 1];
        if (item) { e.preventDefault(); document.body.classList.add("keyhints"); item.click(); }
      }
    });

    // Reveal quick-launch numbers once the user starts driving with the keyboard.
    document.addEventListener("keydown", (e) => {
      if (["Tab", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key)) {
        document.body.classList.add("keyhints");
      }
    }, { passive: true });
  },

  focusIndex(i) {
    const items = this.navItems();
    if (!items.length) return;
    const el = items[Math.max(0, Math.min(i, items.length - 1))];
    items.forEach(n => { n.tabIndex = -1; });
    el.tabIndex = 0;
    el.focus();
    el.scrollIntoView({ block: "nearest" });
  },

  moveFocus(dir) {
    const items = this.navItems();
    if (!items.length) return;
    const cur = items.indexOf(document.activeElement);
    if (cur === -1) return this.focusIndex(0);

    if (dir === "next") return this.focusIndex((cur + 1) % items.length);
    if (dir === "prev") return this.focusIndex((cur - 1 + items.length) % items.length);

    // Vertical: step a whole grid row, derived from live layout.
    const top = items[cur].getBoundingClientRect().top;
    const step = dir === "down" ? 1 : -1;
    for (let i = cur + step; i >= 0 && i < items.length; i += step) {
      if (Math.abs(items[i].getBoundingClientRect().top - top) > 4) return this.focusIndex(i);
    }
    this.focusIndex(dir === "down" ? items.length - 1 : 0);
  },

  toggleHelp(show) {

    if (show) {
      document.getElementById("helpModal").innerHTML = `

        </div>
        ${[

  // ── Typing input ──
  setupInput() {
    const input = document.getElementById("hiddenInput");

    input.addEventListener("compositionstart", () => { this.composing = true; });
    input.addEventListener("compositionend", (e) => {
      this.composing = false;
      if (this.typingActive && e.data) for (const ch of e.data) this.handleChar(ch);
      input.value = "";
    });

    input.addEventListener("keydown", (e) => {
      if (!this.typingActive || this.composing) return;
      if (e.key === "Backspace") {
        e.preventDefault();
        if (this.cursor > 0) {
          this.cursor--;
          this.charEls[this.cursor].className = "char current";
          if (this.cursor + 1 < this.charEls.length) this.charEls[this.cursor + 1].className = "char pending";
          this.highlightKey(this.chars[this.cursor]);
          this.updateProgress();
        }
        return;
      }
      if (e.key.length !== 1) return;
      e.preventDefault();
      this.handleChar(e.key);
    });

    input.addEventListener("input", (e) => {
      if (!this.typingActive || !e.data || this.composing) return;
      this.handleChar(e.data);
      input.value = "";
    });

    input.addEventListener("blur", () => {
      if (this.typingActive) setTimeout(() => input.focus(), 0);
    });
  },

  handleChar(ch) {
    if (this.cursor >= this.chars.length) return;

    this.totalTyped++;
    const expected = this.chars[this.cursor];
    const correct = ch === expected;

    this.charEls[this.cursor].className = `char ${correct ? 'correct' : 'incorrect'}`;
    if (correct) {
      this.combo++;
      if (this.combo > this.maxCombo) this.maxCombo = this.combo;
    } else {
      this.errors++;
      this.combo = 0;
      const d = Store.get();
      const ek = expected.toLowerCase();
      d.errorKeys[ek] = (d.errorKeys[ek] || 0) + 1;
      Store.save();
    }
    this.updateComboUI();
    this.cursor++;

    if (this.cursor < this.chars.length) {
      this.charEls[this.cursor].className = "char current";
      this.highlightKey(this.chars[this.cursor]);
    }

    this.updateLiveStats();
    this.updateProgress();
    this.flashKey(ch, correct);

    if (this.cursor >= this.chars.length) this.finishLesson();
  },

  updateProgress() {
    const el = document.getElementById("sessionProgress");
    if (el) el.style.width = `${(this.cursor / this.chars.length) * 100}%`;
  },

  updateComboUI() {
    const kb = document.getElementById("keyboard");
    const comboEl = document.getElementById("comboCounter");
    const liveCombo = document.getElementById("liveCombo");
    if (!kb || !comboEl) return;
    if (liveCombo) liveCombo.textContent = this.combo;

    kb.classList.remove("combo-5", "combo-10", "combo-20", "combo-50");
    const tiers = [[50, '🔥', 'combo-50'], [20, '⚡', 'combo-20'], [10, '✨', 'combo-10'], [5, '💫', 'combo-5'], [1, '', 'combo-1']];
    const tier = tiers.find(([min]) => this.combo >= min);
    if (!tier) { comboEl.className = "combo-counter"; comboEl.textContent = ""; return; }
    const [, icon, cls] = tier;
    if (cls !== "combo-1") kb.classList.add(cls);
    comboEl.className = `combo-counter on ${cls}-text`;
    comboEl.textContent = `${icon} ${this.combo}`.trim();
  },

  updateLiveStats() {
    if (!this.startTime) return;
    const elapsed = (Date.now() - this.startTime) / 1000 / 60;
    const correctChars = this.cursor - this.errors;
    this.wpm = elapsed > 0 ? Math.max(0, Math.round((correctChars / 5) / elapsed)) : 0;
    this.accuracy = this.totalTyped > 0 ? Math.round(((this.totalTyped - this.errors) / this.totalTyped) * 100) : 100;
    document.getElementById("liveWpm").textContent = this.wpm;
    document.getElementById("liveAccuracy").textContent = this.accuracy + "%";
    document.getElementById("liveErrors").textContent = this.errors;
  },

  tick() {
    if (!this.startTime) return;
    this.elapsed = Math.floor((Date.now() - this.startTime) / 1000);
    const min = Math.floor(this.elapsed / 60);
    const sec = this.elapsed % 60;
    const timer = document.getElementById("timer");
    if (timer) timer.textContent = `${min}:${sec.toString().padStart(2, '0')}`;
    this.updateLiveStats();
    if (this.elapsed >= this.lessonDuration) this.finishLesson();
  },

  flashKey(ch, correct) {
    const el = document.querySelector(`.kb-key[data-key="${CSS.escape(ch.toLowerCase())}"]`);
    if (!el) return;
    el.classList.add(correct ? "correct" : "wrong");
    setTimeout(() => el.classList.remove("correct", "wrong"), 220);
  },

  highlightKey(ch) {
    this.clearKeyHighlights();
    if (ch == null) return;
    const key = ch.toLowerCase();
    const el = document.querySelector(`.kb-key[data-key="${CSS.escape(key)}"]`);
    if (el) el.classList.add("next");
    const finger = FINGER_MAP[key];
    if (finger) {
      const bar = document.getElementById(`finger-${finger}`);
      if (bar) bar.classList.add("active");
    }
  },

  clearKeyHighlights() {
    document.querySelectorAll(".kb-key.next").forEach(el => el.classList.remove("next"));
    document.querySelectorAll(".finger-bar.active").forEach(el => el.classList.remove("active"));
  },

  stopTyping() {
    this.typingActive = false;
    if (this.timerInterval) { clearInterval(this.timerInterval); this.timerInterval = null; }
  },

  // ── Finish ──
  finishLesson() {
    if (!this.typingActive && this.cursor === 0) return;
    this.stopTyping();
    this.clearKeyHighlights();

    const stage = this.currentStage;
    const stageId = stage.id;
    const lessonId = this.isTest ? "test" : this.currentLesson.id;
    const d = Store.get();

    this.updateLiveStats();
    const { wpm, accuracy } = this;
    const stars = this.isTest
      ? this.calcStars(wpm, accuracy, stage.test.minWpm, stage.test.minAccuracy)
      : this.calcStars(wpm, accuracy, 20, 85);
    const xp = this.calcXp(wpm, accuracy, stars);
    const isRecord = wpm > d.bestWpm;

    this.recordPractice();
    this.addXp(xp);

    if (wpm > d.bestWpm) d.bestWpm = wpm;
    if (accuracy > d.bestAccuracy) d.bestAccuracy = accuracy;

    d.history.push({
      date: new Date().toISOString(),
      themeId: this.currentTheme,
      lessonId, stageId, wpm, accuracy, xp, stars,
      maxCombo: this.maxCombo,
      totalChars: this.totalTyped,
      errorCount: this.errors,
    });

    let passed = true;
    if (this.isTest) {
      passed = wpm >= stage.test.minWpm && accuracy >= stage.test.minAccuracy;
      const sKey = stageKey(this.currentTheme, stageId);
      if (passed && !d.clearedStages.includes(sKey)) d.clearedStages.push(sKey);
    } else {
      d.totalLessons++;
      const lKey = lessonKey(this.currentTheme, lessonId);
      const existing = d.completedLessons[lKey];
      d.completedLessons[lKey] = {
        bestWpm: Math.max(wpm, existing?.bestWpm || 0),
        bestAccuracy: Math.max(accuracy, existing?.bestAccuracy || 0),
        stars: Math.max(stars, existing?.stars || 0),
        attempts: (existing?.attempts || 0) + 1,
      };
    }

    Store.save();
    this.checkBadges();
    this.renderSidebar();
    this.showResults(wpm, accuracy, stars, xp, passed, isRecord);
  },

  showResults(wpm, accuracy, stars, xp, passed, isRecord) {
    const stage = this.currentStage;
    const stageId = stage.id;
    const isTest = this.isTest;

    let title, subtitle, icon;
    if (isTest) {
      icon = passed ? "🎉" : "💪";
      title = passed ? "Stage cleared!" : "So close";
      subtitle = passed
        ? `You passed the ${stage.title} test.`
        : `You need ${stage.test.minWpm}+ wpm and ${stage.test.minAccuracy}%+ accuracy.`;
    } else {
      if (stars >= 4) { icon = "🌟"; title = "Outstanding"; }
      else if (stars >= 3) { icon = "🎉"; title = "Great job"; }
      else if (stars >= 2) { icon = "👍"; title = "Well done"; }
      else { icon = "💪"; title = "Keep practicing"; }
      subtitle = this.currentLesson ? this.currentLesson.title : "Practice complete";
    }

    const nextLessonId = !isTest ? this.getNextLessonId() : null;
    const stages = getStages(this.currentTheme);
    const actions = [];

    if (!isTest && nextLessonId) {
      actions.push({ key: "1", label: "Next lesson →", primary: true, run: () => { this.closeModal(); this.startLesson(stageId, nextLessonId); } });
    } else if (!isTest && stage.test) {
      actions.push({ key: "1", label: "Take stage test →", primary: true, run: () => { this.closeModal(); this.startTest(stageId); } });
    } else if (isTest && !passed) {
      actions.push({ key: "1", label: "Retry test", primary: true, run: () => { this.closeModal(); this.startTest(stageId); } });
    } else if (isTest && passed && stages.some(s => s.id === stageId + 1)) {
      actions.push({ key: "1", label: "Next stage →", primary: true, run: () => { this.closeModal(); this.openStage(stageId + 1); } });
    } else {
      actions.push({ key: "1", label: "Practice again", primary: true, run: () => { this.closeModal(); this.restart(); } });
    }
    actions.push({ key: "2", label: "Stage menu", primary: false, run: () => { this.closeModal(); this.openStage(stageId); } });
    actions.push({ key: "3", label: "Dashboard", primary: false, run: () => { this.closeModal(); this.showDashboard(); } });
    this._modalActions = actions;

    document.getElementById("modal").innerHTML = `
      <div class="modal-icon">${icon}</div>
      <div class="modal-title" id="modalTitle">${esc(title)}</div>
      <div class="modal-subtitle">${esc(subtitle)}</div>
      <div class="modal-stars">${starHtml(stars)}</div>
      <div class="modal-stats">
        <div class="modal-stat"><div class="modal-stat-value" style="color:var(--accent)">${wpm}</div><div class="modal-stat-label">WPM</div></div>
        <div class="modal-stat"><div class="modal-stat-value" style="color:var(--green)">${accuracy}%</div><div class="modal-stat-label">Accuracy</div></div>
        <div class="modal-stat"><div class="modal-stat-value" style="color:var(--red)">${this.errors}</div><div class="modal-stat-label">Errors</div></div>
        <div class="modal-stat"><div class="modal-stat-value" style="color:var(--amber)">${this.maxCombo}</div><div class="modal-stat-label">Combo</div></div>
      </div>
      ${isTest ? `<div class="modal-target">
        <span>Target <b>${stage.test.minWpm}</b> wpm — you hit <b style="color:${wpm >= stage.test.minWpm ? 'var(--green)' : 'var(--red)'}">${wpm}</b></span>
        <span>Target <b>${stage.test.minAccuracy}%</b> — you hit <b style="color:${accuracy >= stage.test.minAccuracy ? 'var(--green)' : 'var(--red)'}">${accuracy}%</b></span>
      </div>` : ''}
      <div class="modal-xp">✨ ${xp} XP earned${isRecord ? ' · 🏆 new personal best' : ''}</div>
      <div class="modal-actions">
        ${actions.map((a, i) => `<button class="btn ${a.primary ? 'btn-primary' : 'btn-secondary'}" data-modal-idx="${i}"><kbd>${a.key}</kbd> ${esc(a.label)}</button>`).join('')}
      </div>
      <div class="modal-foot">Press <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> or <kbd>Esc</kbd></div>
    `;

    const overlay = document.getElementById("modalOverlay");
    overlay.classList.add("show");
    overlay.querySelector("[data-modal-idx]").focus();
    document.getElementById("modal").onclick = (e) => {
      const btn = e.target.closest("[data-modal-idx]");
      if (btn) actions[Number(btn.dataset.modalIdx)].run();
    };
  },

  getNextLessonId() {
    if (!this.currentStage || !this.currentLesson) return null;
    const lessons = this.currentStage.lessons;
    const idx = lessons.findIndex(l => l.id === this.currentLesson.id);
    return idx > -1 && idx < lessons.length - 1 ? lessons[idx + 1].id : null;
  },

  closeModal() {
    document.getElementById("modalOverlay").classList.remove("show");
    this._modalActions = null;
  },

          <div class="hub-hero-stat"><b>${totalStages}</b><span>Stages</span></div>
          <div class="hub-hero-stat"><b>${totalLessons}</b><span>Lessons</span></div>
        </div>
      </div>
      ${catBlocks}
    `;
    this.indexNavItems();
  },

  showKitDetail(tid) {
    this.stopTyping();
    const t = THEMES[tid];
    if (!t) return this.showKitHub();
    const stages = t.stages;
    const d = Store.get();
    const enabled = d.enabledKits || THEME_ORDER;
    const isEnabled = enabled.includes(tid);
    const cat = KIT_CATEGORIES.find(c => c.id === t.category);

    const totalLessons = stages.reduce((sum, s) => sum + s.lessons.length, 0);
    const doneLessons = stages.reduce((sum, s) => sum + s.lessons.filter(l => d.completedLessons[lessonKey(tid, l.id)]).length, 0);
    const clearedStages = stages.filter(s => d.clearedStages.includes(stageKey(tid, s.id))).length;
    const pct = totalLessons ? Math.round((doneLessons / totalLessons) * 100) : 0;
    const sample = stages[0]?.lessons[0];

    const stagesList = stages.map(s => {
      const lessonDone = s.lessons.filter(l => d.completedLessons[lessonKey(tid, l.id)]).length;
      const cleared = d.clearedStages.includes(stageKey(tid, s.id));
      return `<div class="kd-stage ${cleared ? 'cleared' : ''}">
        <div class="kd-stage-head">
          <span class="kd-stage-num">${s.id}</span>
          <div class="kd-stage-info">
            <div class="kd-stage-title">${esc(s.title)}</div>
            <div class="kd-stage-desc">${esc(s.desc)}</div>
          </div>
          <div class="kd-stage-count">${lessonDone}/${s.lessons.length}${cleared ? ' ✓' : ''}</div>
        </div>
        <div class="kd-lessons">
          ${s.lessons.map(l => `<span class="kd-lesson ${d.completedLessons[lessonKey(tid, l.id)] ? 'done' : ''}">
            <span class="kd-lesson-id">${esc(l.id)}</span>${esc(l.title)}${d.completedLessons[lessonKey(tid, l.id)] ? ' ✓' : ''}
          </span>`).join('')}
        </div>
        ${s.test ? `<div class="kd-test">🧪 Stage test — ${esc(s.test.title)}: needs <b>${s.test.minWpm} wpm</b> at <b>${s.test.minAccuracy}%</b> accuracy</div>` : ''}
      </div>`;
    }).join('');

    this.setViewChrome("kit-detail", [
      { label: 'Typrr', act: 'view', arg: 'dashboard' },
      { label: 'Kit Hub', act: 'view', arg: 'kits' },
      { label: t.name }
    ], [['d', 'dashboard'], ['k', 'kits']]);

    document.getElementById("content").innerHTML = `
      <div class="kd-hero">
        <span class="kd-hero-icon">${t.icon}</span>
        <div class="kd-hero-body">
          <div class="kd-hero-cat">${cat ? esc(cat.icon + ' ' + cat.name) : 'Typing kit'}</div>
          <h1 class="kd-hero-title">${esc(t.name)}</h1>
          <p class="kd-hero-desc">${esc(t.desc)}</p>
        </div>
        <div class="kd-hero-side">
          <button class="kd-action ${isEnabled ? 'installed' : ''}" data-act="kit-toggle" data-arg="${tid}"${isEnabled && enabled.length === 1 ? ' disabled title="Keep at least one kit installed"' : ''}>${isEnabled ? '✕ Remove kit' : '⬇ Download kit'}</button>
          ${isEnabled ? `<button class="kd-practice" data-act="theme" data-arg="${tid}">▶ Practise this kit</button>` : ''}
        </div>
      </div>

      <div class="kd-stats">
        <div class="kd-stat"><span class="kd-stat-label">Stages</span><span class="kd-stat-value">${stages.length}</span></div>
        <div class="kd-stat"><span class="kd-stat-label">Lessons</span><span class="kd-stat-value">${totalLessons}</span></div>
        <div class="kd-stat"><span class="kd-stat-label">Completed</span><span class="kd-stat-value">${doneLessons}</span></div>
        <div class="kd-stat"><span class="kd-stat-label">Tests passed</span><span class="kd-stat-value">${clearedStages}</span></div>
      </div>

      <div class="kd-progress">
        <div class="kd-progress-head"><span>Your progress</span><span>${pct}%</span></div>
        <div class="kd-progress-track"><span class="kd-progress-fill" style="width:${pct}%"></span></div>
      </div>

      ${sample ? `<div class="kd-sample">
        <div class="kd-sample-label">Sample exercise — ${esc(stages[0].title)} · ${esc(sample.title)}</div>
        <div class="kd-sample-text">${esc(sample.text)}</div>
      </div>` : ''}

      <h2 class="kd-section-title">${stages.length} stages in this kit</h2>
      <div class="kd-stages">${stagesList}</div>
    `;
    this.indexNavItems();
  },

  toggleKit(tid) {
    const d = Store.get();
    if (!d.enabledKits) d.enabledKits = [...THEME_ORDER];
    const i = d.enabledKits.indexOf(tid);
    if (i >= 0) {
      if (d.enabledKits.length <= 1) return;
      d.enabledKits.splice(i, 1);
      if (this.currentTheme === tid) this.currentTheme = d.enabledKits[0];
    } else {
      d.enabledKits.push(tid);
    }
    Store.save();
    this.renderSidebar();
    // Stay where the user is: the hub grid or that kit's own page.
    if (this.view === "kit-detail") this.showKitDetail(tid);
    else this.showKitHub();
  },
};

App.init();

// Installability and offline support. file:// has no worker scope, and a stale
// registration on an unsupported page is worse than none.
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
